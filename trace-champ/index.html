<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5bc8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trace Champ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Trace Champ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: sibling of Rainbow Doodle. Sky-blue toy frame; a home screen of level cards,
     then a play board with school-ruled paper, a dotted trail to trace and a dot meter. */
  --frame:#5bc8f5;
  --frame-shade:#2e9fd2;
  --ink:#231a4f;
  --key:#fffaf0;
  --gold:#ffc83d;
  --go:#2fcf6b;
  --pop:#ff4f8b;
  --lane:#ece7ff;
  --display:"Bagel Fat One","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --dots:radial-gradient(circle at 2px 2px,rgba(255,255,255,.4) 1.6px,transparent 1.9px) 0 0/16px 16px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
  background:var(--dots),var(--frame);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}

/* ---------- shared bits ---------- */
.key{
  position:relative;display:grid;place-items:center;padding:0;min-width:0;cursor:pointer;
  background:var(--key);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
  transition:transform .09s ease,box-shadow .09s ease,background-color .15s ease,opacity .15s;touch-action:manipulation;
}
.key svg{display:block;pointer-events:none}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key[disabled]{opacity:.45;cursor:default}
.key[disabled]:active{transform:none;box-shadow:0 4px 0 var(--ink)}
.key:focus-visible,.pill:focus-visible,.card:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pill{
  position:relative;padding:12px 20px;border:3px solid var(--ink);border-radius:999px;background:var(--key);box-shadow:0 4px 0 var(--ink);
  font:800 18px/1 var(--body);cursor:pointer;touch-action:manipulation;transition:transform .09s,box-shadow .09s;
}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pill.primary{background:var(--go);color:#fff;-webkit-text-stroke:.4px var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border:3px solid var(--ink);border-radius:999px;background:var(--key);
  font:800 17px/1 var(--body);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip svg{width:24px;height:24px}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{scale:1}40%{scale:1.2}100%{scale:1}}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;gap:12px}
.home-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.title{margin:4px 0 0;font:400 clamp(46px,14vw,84px)/.95 var(--display);letter-spacing:1px}
.title span{display:inline-block;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.title span:nth-child(5n+1){color:#ffc83d}
.title span:nth-child(5n+2){color:#ff6b8f}
.title span:nth-child(5n+3){color:#fff}
.title span:nth-child(5n+4){color:#7cf0a5}
.title span:nth-child(5n+5){color:#b9a6ff}
.title .w{display:inline-block;white-space:nowrap;margin:0 .12em}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.howto{margin:0;max-width:40ch;font:700 16px/1.35 var(--body);text-wrap:balance}
.seg{display:inline-flex;padding:4px;gap:4px;border:3px solid var(--ink);border-radius:999px;background:var(--key);box-shadow:0 3px 0 var(--ink)}
.seg button{border:0;border-radius:999px;padding:8px 16px;background:transparent;font:800 16px/1 var(--body);cursor:pointer;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;touch-action:pan-x;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:72px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border:3px solid var(--ink);border-radius:16px;
  background:rgba(255,250,240,.7);box-shadow:0 4px 0 var(--ink);font:800 17px/1 var(--body);cursor:pointer;touch-action:pan-x}
.tab[aria-selected="true"]{background:var(--gold);transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.tab small{display:inline-flex;align-items:center;gap:2px;font:700 13px/1 var(--body);opacity:.75;font-variant-numeric:tabular-nums}
.tab small svg{width:13px;height:13px;fill:#ffc83d}
#levels{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:14px;padding:4px 4px 18px;align-content:start}
.card{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 8px;cursor:pointer;touch-action:pan-y;
  background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);transition:transform .09s,box-shadow .09s;
}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.card svg.pv{width:100%;aspect-ratio:1;max-height:110px}
.card .nm{font:800 15px/1.1 var(--body);text-align:center}
.mini-stars{display:inline-flex;gap:1px}
.mini-stars svg{width:18px;height:18px}

/* ---------- play ---------- */
#play{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.bar .grow{flex:1 1 4px;min-width:2px}
.top .key{width:48px;height:46px}
.top .key svg{width:64%;height:64%}
.level-pill{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 12px;border:3px solid var(--ink);border-radius:16px;background:var(--key);box-shadow:0 3px 0 var(--ink)}
.level-pill #levelName{font:400 20px/1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.pro-tag{font:800 12px/1 var(--body);padding:4px 7px;border-radius:8px;background:var(--pop);color:#fff;border:2px solid var(--ink)}
#paper{
  position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
  border:3px solid var(--ink);border-radius:26px;background:#fff;box-shadow:0 6px 0 var(--frame-shade);
}
#paper canvas{position:absolute;left:0;top:0;touch-action:none}
#guide,#fx{pointer-events:none}
#markers{position:absolute;inset:0;pointer-events:none}
.marker{
  position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;display:grid;place-items:center;
  background:var(--go);border:3px solid var(--ink);color:#fff;font:800 17px/1 var(--body);transition:opacity .3s,scale .3s;
}
.marker::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--go);opacity:0;animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.marker.gone{opacity:.0;scale:.6}
.bottom{gap:8px}
.bottom .key{width:58px;height:58px;border-radius:18px;flex:0 0 auto}
.bottom .key svg{width:62%;height:62%}
.meter{position:relative;flex:1 1 auto;min-width:0;height:40px;border:3px solid var(--ink);border-radius:999px;background:var(--key);overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.meter-fill{position:absolute;inset:0;width:0;background:repeating-linear-gradient(-45deg,#ffd768 0 10px,#ffc83d 10px 20px);border-right:3px solid var(--ink);transition:width .2s ease}
.meter-fill.full{border-right:0}
.meter-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5px;font:800 16px/1 var(--body);font-variant-numeric:tabular-nums}
.meter-text svg{width:18px;height:18px}
#doneBtn{width:auto;padding:0 16px 0 12px;display:flex;gap:6px;font:800 19px/1 var(--body);background:var(--go);color:#fff;-webkit-text-stroke:.4px var(--ink)}
#doneBtn svg{width:26px;height:26px}
#doneBtn[disabled]{background:#d8d4e6;color:var(--ink);-webkit-text-stroke:0}
.ready{animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{transform:translateY(-4px) scale(1.05);box-shadow:0 8px 0 var(--ink)}}

/* ---------- result ---------- */
#result{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(255,255,255,.3)}
.rcard{
  width:min(100%,420px);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 14px 16px;text-align:center;
  background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);animation:rise .3s cubic-bezier(.3,1.4,.5,1)
}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.rstars{display:flex;gap:8px;margin-top:-2px}
.rstars svg{width:44px;height:44px;transition:transform .2s}
.rstars svg.on{animation:starpop .45s cubic-bezier(.3,1.8,.5,1)}
.rstars svg:nth-child(2){transform:translateY(-10px)}
@keyframes starpop{0%{scale:.2}60%{scale:1.3}100%{scale:1}}
.score{display:flex;align-items:baseline;gap:4px;font:400 52px/1 var(--display);font-variant-numeric:tabular-nums}
.score small{font:800 20px/1 var(--body);opacity:.6}
#resultMsg{margin:0;font:800 20px/1.2 var(--body);text-wrap:balance}
#resultTip{margin:0;font:600 15px/1.35 var(--body);max-width:34ch;text-wrap:balance}
.rstats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:2px 0 4px}
.rstats span{padding:5px 10px;border-radius:999px;background:#f1eeff;font:700 14px/1 var(--body);font-variant-numeric:tabular-nums}
.earned{display:flex;align-items:center;gap:8px;font:800 18px/1 var(--body)}
.newbest{padding:4px 8px;border-radius:8px;background:var(--pop);color:#fff;font:800 13px/1 var(--body);border:2px solid var(--ink)}
.ractions{display:flex;gap:10px;margin-top:6px}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#toast{
  position:fixed;z-index:70;left:50%;top:calc(env(safe-area-inset-top) + 72px);width:max-content;max-width:calc(100vw - 28px);
  padding:10px 16px;border-radius:18px;background:var(--ink);color:#fff;font:700 16px/1.25 var(--body);text-align:center;
  transform:translate(-50%,-14px);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease;
}
#toast.show{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion: reduce){
  .marker::after,.ready,.bump,.rstars svg.on,.rcard{animation:none}
  .key,.pill,.card,.meter-fill,#toast{transition:none}
}
@media (min-width:700px){ #levels{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.3l-6 3.4 1.3-6.8-5-4.7 6.8-.8z" stroke="#231a4f" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 48 48"><path d="M14 13H7a7 7 0 0 0 8 9M34 13h7a7 7 0 0 1-8 9" fill="none" stroke="#231a4f" stroke-width="3.5" stroke-linecap="round"/><path d="M13 7h22v10a11 11 0 0 1-22 0z" fill="#ffc83d" stroke="#231a4f" stroke-width="3" stroke-linejoin="round"/><path d="M24 28v7" stroke="#231a4f" stroke-width="3.5"/><rect x="15" y="35" width="18" height="7" rx="2" fill="#ff7aa8" stroke="#231a4f" stroke-width="3"/><path d="M19 12v5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<!-- =============== HOME =============== -->
<section id="home" class="screen" aria-label="Choose something to trace">
  <header class="home-head">
    <h1 class="title" aria-label="Trace Champ"><span class="w" aria-hidden="true"><span>T</span><span>r</span><span>a</span><span>c</span><span>e</span></span><span class="w" aria-hidden="true"><span>C</span><span>h</span><span>a</span><span>m</span><span>p</span></span></h1>
    <div class="stats">
      <span class="chip" id="homePointsChip"><svg aria-hidden="true"><use href="#i-trophy"/></svg><b id="homePoints">0</b>&nbsp;points</span>
      <span class="chip"><svg aria-hidden="true" style="fill:#ffc83d"><use href="#i-star"/></svg><b id="homeStars">0</b>&nbsp;stars</span>
    </div>
    <p class="howto">Start at the green dot. Trace over the line and light up every dot. Stay close to the line for more points!</p>
    <div class="seg" role="group" aria-label="Difficulty">
      <button type="button" data-mode="easy" aria-pressed="true">Easy</button>
      <button type="button" data-mode="pro" aria-pressed="false">Pro: double points</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Chapters"></nav>
  <div id="levels"></div>
</section>

<!-- =============== PLAY =============== -->
<section id="play" class="screen" aria-label="Tracing" hidden>
  <header class="bar top">
    <button id="homeBtn" class="key" type="button" aria-label="Back to all levels" title="All levels">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 24 24 9l17 15" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21v19h24V21" fill="#ffc83d" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><path d="M20 40V30h8v10" fill="#ff7aa8" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>
    </button>
    <div class="level-pill"><span id="levelName">Circle</span><span class="pro-tag" id="proTag" hidden>PRO</span><span class="mini-stars" id="levelBest"></span></div>
    <span class="grow"></span>
    <span class="chip" id="playPointsChip"><svg aria-hidden="true"><use href="#i-trophy"/></svg><b id="playPoints">0</b></span>
  </header>

  <main id="paper">
    <canvas id="guide" aria-hidden="true"></canvas>
    <canvas id="ink" aria-label="Tracing paper"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <div id="markers"></div>
    <div id="result" hidden>
      <div class="rcard" role="dialog" aria-label="Your score">
        <div class="rstars" id="rstars">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg>
        </div>
        <div class="score"><span id="scoreNum">0</span><small>/ 100</small></div>
        <p id="resultMsg">Great tracing!</p>
        <p id="resultTip" hidden></p>
        <div class="rstats"><span>On the line <b id="statAcc">0%</b></span><span>Traced <b id="statCov">0%</b></span></div>
        <div class="earned"><svg width="26" height="26" aria-hidden="true"><use href="#i-trophy"/></svg><span id="earnedText">+0 points</span><span class="newbest" id="newBest" hidden>New best!</span></div>
        <div class="ractions">
          <button id="againBtn" class="pill" type="button">Try again</button>
          <button id="nextBtn" class="pill primary" type="button">Next</button>
        </div>
      </div>
    </div>
  </main>

  <nav class="bar bottom" aria-label="Tracing controls">
    <button id="restartBtn" class="key" type="button" aria-label="Start over" title="Start over">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M38 24a14 14 0 1 1-4.1-9.9" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><path d="M36 6v9h-9" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="showBtn" class="key" type="button" aria-label="Show me how" title="Show me how">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 38c4-16 10-24 18-24" fill="none" stroke="#2fcf6b" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 7"/><circle cx="31" cy="15" r="11" fill="#2fcf6b" stroke="currentColor" stroke-width="3"/><path d="M28 9.5l9 5.5-9 5.5z" fill="#fff" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <div class="meter" role="progressbar" aria-label="Dots lit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter">
      <div class="meter-fill" id="meterFill"></div>
      <div class="meter-text"><svg viewBox="0 0 24 24" aria-hidden="true" style="fill:#ffc83d"><use href="#i-star"/></svg><span id="meterText">0 / 0</span></div>
    </div>
    <button id="doneBtn" class="key" type="button" disabled>
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 25l9 9 19-20" fill="none" stroke="#231a4f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 25l9 9 19-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Done
    </button>
  </nav>
</section>

<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const now = () => performance.now();
const rand = (a, b) => a + Math.random() * (b - a);
const f1 = n => Math.round(n * 10) / 10;

/* ================= shapes to trace (drawn in a 100 x 100 box) ================= */
const poly = pts => pts.map((p, i) => (i ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1])).join(' ');
const circle = (cx, cy, r) => `M${cx} ${cy - r} A${r} ${r} 0 1 0 ${cx} ${cy + r} A${r} ${r} 0 1 0 ${cx} ${cy - r}`;
function starPath() { const p = []; for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 18 : 44; p.push([50 + r * Math.cos(a), 54 + r * Math.sin(a)]); } return poly(p); }
function spiralPath() { const p = []; for (let t = 0; t <= 5 * Math.PI + 0.001; t += 0.08) { const r = 2 + t * 2.4; p.push([50 + r * Math.cos(t), 50 + r * Math.sin(t)]); } return poly(p); }
function loopsPath() { const p = []; for (let t = 0; t <= 8 * Math.PI + 0.001; t += 0.07) p.push([14 + 2.94 * t - 16 * Math.sin(t), 58 - 16 * Math.cos(t)]); return poly(p); }
function rosePath() { const p = []; for (let t = 0; t <= Math.PI + 0.0001; t += Math.PI / 240) { const r = 26 * Math.cos(5 * t), a = t - Math.PI / 2; p.push([50 + r * Math.cos(a), 40 + r * Math.sin(a)]); } return poly(p); }
function sunRays() { const out = []; for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 - Math.PI / 2; out.push(poly([[50 + 26 * Math.cos(a), 50 + 26 * Math.sin(a)], [50 + 41 * Math.cos(a), 50 + 41 * Math.sin(a)]])); } return out; }

const L = (name, strokes) => ({ name, strokes });
const CHAPTERS = [
  { id: 'shapes', tab: 'Shapes', ruled: false, levels: [
    L('Line', ['M10 50 H90']),
    L('Zigzag', ['M8 70 L24 30 L40 70 L56 30 L72 70 L88 30']),
    L('Wave', ['M4 50 Q16 18 28 50 T52 50 T76 50 T100 50']),
    L('Circle', [circle(50, 50, 40)]),
    L('Square', ['M14 14 H86 V86 H14 Z']),
    L('Triangle', ['M50 10 L92 86 H8 Z']),
    L('Heart', ['M50 85 C20 62 6 45 14 28 C22 12 44 14 50 30 C56 14 78 12 86 28 C94 45 80 62 50 85 Z']),
    L('Star', [starPath()]),
    L('Spiral', [spiralPath()]),
    L('Loop-de-loop', [loopsPath()])
  ]},
  { id: 'numbers', tab: '123', ruled: true, prefix: 'Number ', levels: [
    L('0', ['M50 10 A26 40 0 1 0 50 90 A26 40 0 1 0 50 10']),
    L('1', ['M34 26 L52 10 V90']),
    L('2', ['M28 30 C28 6 72 4 72 30 C72 50 40 66 28 90 H74']),
    L('3', ['M30 20 C40 6 70 6 70 28 C70 44 56 48 46 48 C66 48 74 60 74 70 C74 92 40 96 28 80']),
    L('4', ['M54 10 L24 64 H80', 'M62 30 V90']),
    L('5', ['M34 10 L30 46 C46 36 74 40 74 64 C74 92 38 96 28 80', 'M34 10 H70']),
    L('6', ['M68 16 C56 6 34 8 30 36 C26 66 32 90 52 90 C70 90 74 74 74 66 C74 50 62 44 52 44 C40 44 30 52 30 62']),

function fxLoop() {
  const t = now();
  wipe(fctx, fx);
  fxItems = fxItems.filter(it => it.draw(fctx, t));
  if (fxItems.length) requestAnimationFrame(fxLoop); else { fxRunning = false; wipe(fctx, fx); }
}
function beadPop(b) {
  if (reduceMotion) return;
  const t0 = now();
  addFx({ draw(g, t) {
    const k = (t - t0) / 420; if (k >= 1) return false;
    g.save(); g.globalAlpha = 1 - k; g.strokeStyle = '#ffc83d'; g.lineWidth = 4 * (1 - k) + 1;
    g.beginPath(); g.arc(b.x, b.y, 8 + 22 * k, 0, Math.PI * 2); g.stroke(); g.restore();
    drawStar(g, b.x, b.y, 10 + 10 * Math.sin(k * Math.PI), '#ffe27a', false, k * 2);
    return true;
  } });
}

/* ================= play: drawing input ================= */
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
let hue = Math.random() * 360;
function nearestT(p) {
  let best = Infinity; const T = cur.T;
  for (let i = 0; i < T.length; i++) { const dx = T[i].x - p.x, dy = T[i].y - p.y, d = dx * dx + dy * dy; if (d < best) best = d; }
  return Math.sqrt(best);
}
function addUserPoint(p) {
  cur.U.push(p);
  const R = tol().bead;
  for (const b of cur.beads) {
    if (b.lit) continue;
    if (Math.abs(b.x - p.x) > R || Math.abs(b.y - p.y) > R) continue;
    if (Math.hypot(b.x - p.x, b.y - p.y) <= R) {
      b.lit = true; cur.lit++;
      drawBead(b); beadPop(b);
      Sound.bead(cur.lit / cur.beads.length);
      const m = $(`.marker[data-si="${b.si}"]`); if (m) m.classList.add('gone');
      updateMeter();
      if (cur.lit === cur.beads.length) { Sound.allDots(); buzz(15); }
    }
  }
}
function seg(m0, p0, m1, color, w) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(m0.x, m0.y); ctx.quadraticCurveTo(p0.x, p0.y, m1.x, m1.y); ctx.stroke(); ctx.restore();
}
const OFF = '#bdb6d3';
function lineColor(onTrack) { return onTrack ? `hsl(${hue | 0},92%,52%)` : OFF; }
const ptFrom = (e, r) => ({ x: e.clientX - r.left, y: e.clientY - r.top });

ink.addEventListener('pointerdown', e => {
  if (!cur || cur.finished) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  stopDemo();
  clearTimeout(cur.finishTimer);
  try { ink.setPointerCapture(e.pointerId); } catch (_) {}
  const p = ptFrom(e, ink.getBoundingClientRect());
  const on = nearestT(p) <= tol().on;
  const st = { p, m: p, last: p, on };
  active.set(e.pointerId, st);
  ctx.save(); ctx.fillStyle = lineColor(on); ctx.beginPath(); ctx.arc(p.x, p.y, tol().line / 2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  if (!cur.startedAt) cur.startedAt = now();
  addUserPoint(p);
  updateDone();
});
ink.addEventListener('pointermove', e => {
  const st = active.get(e.pointerId);
  if (!st || !cur || cur.finished) return;
  e.preventDefault();
  const rect = ink.getBoundingClientRect();
  let list = null;
  try { list = e.getCoalescedEvents ? e.getCoalescedEvents() : null; } catch (_) {}
  if (!list || !list.length) list = [e];
  const T = tol();
  for (const ev of list) {
    const q = ptFrom(ev, rect);
    const d = Math.hypot(q.x - st.p.x, q.y - st.p.y);
    if (d < 1) continue;
    // resample every 3px for fair scoring
    const steps = Math.max(1, Math.ceil(d / 3));
    for (let k = 1; k <= steps; k++) addUserPoint({ x: st.p.x + (q.x - st.p.x) * k / steps, y: st.p.y + (q.y - st.p.y) * k / steps });
    const on = nearestT(q) <= T.on;
    if (on) hue = (hue + d * 0.6) % 360;
    else if (st.on) Sound.bonk();
    st.on = on;
    const m1 = mid(st.p, q);
    seg(st.m, st.p, m1, lineColor(on), T.line);
    st.m = m1; st.p = q;
  }
  updateDone();
});
function endPointer(e) {
  const st = active.get(e.pointerId);
  if (!st) return;
  active.delete(e.pointerId);
  if (!cur || cur.finished) return;
  seg(st.m, st.p, st.p, lineColor(st.on), tol().line);
  updateDone();
  if (cur.lit === cur.beads.length && active.size === 0) {
    clearTimeout(cur.finishTimer);
    cur.finishTimer = setTimeout(() => { if (active.size === 0) finish(); }, 650);
  }
}
ink.addEventListener('pointerup', endPointer);
ink.addEventListener('pointercancel', endPointer);
ink.addEventListener('lostpointercapture', endPointer);
ink.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
ink.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

/* ================= show me how ================= */
let demo = null;
function stopDemo() { if (demo) { demo.stop = true; demo = null; } }
function playDemo() {
  if (!cur || cur.finished) return;
  stopDemo(); Sound.click();
  const strokes = cur.strokes.map(s => {
    const cum = [0];
    for (let i = 1; i < s.length; i++) cum.push(cum[i - 1] + Math.hypot(s[i].x - s[i - 1].x, s[i].y - s[i - 1].y));
    return { s, cum, len: cum[cum.length - 1] };
  });
  const speed = 230, gap = 350;
  const d = { stop: false, t0: now() };
  demo = d;
  let total = 0; strokes.forEach(st => { st.start = total; total += st.len / speed * 1000 + gap; });
  const at = (st, dist) => {
    let i = 1; while (i < st.cum.length - 1 && st.cum[i] < dist) i++;
    const a = st.s[i - 1], b = st.s[i], span = st.cum[i] - st.cum[i - 1] || 1, k = Math.max(0, Math.min(1, (dist - st.cum[i - 1]) / span));
    return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
  };
  addFx({ draw(g, t) {
    if (d.stop) return false;
    const el = t - d.t0;
    if (el > total + 500) { if (demo === d) demo = null; return false; }
    const fade = el > total ? 1 - (el - total) / 500 : 1;
    g.save(); g.globalAlpha = fade;
    let head = null;
    strokes.forEach((st, i) => {
      const local = el - st.start;
      if (local <= 0) return;
      const dist = Math.min(st.len, local / 1000 * speed);
      g.strokeStyle = 'rgba(47,207,107,.55)'; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(st.s[0].x, st.s[0].y);
      for (let j = 1; j < st.s.length && st.cum[j] <= dist; j++) g.lineTo(st.s[j].x, st.s[j].y);
      const p = at(st, dist); g.lineTo(p.x, p.y); g.stroke();
      if (dist < st.len || i === strokes.length - 1) head = p;
    });
    if (head) {
      g.beginPath(); g.arc(head.x, head.y, 13, 0, Math.PI * 2); g.fillStyle = '#2fcf6b'; g.fill();
      g.lineWidth = 3; g.strokeStyle = '#231a4f'; g.stroke();
      g.beginPath(); g.arc(head.x - 3, head.y - 3, 4, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill();
    }
    g.restore();
    return true;
  } });
}

/* ================= scoring ================= */
function scoreTrace() {
  const T = cur.T, U = cur.U, tl = tol();
  let accSum = 0;
  for (const u of U) {
    const d = nearestT(u);
    accSum += d <= tl.full ? 1 : d >= tl.zero ? 0 : 1 - (d - tl.full) / (tl.zero - tl.full);
  }
  const acc = U.length ? accSum / U.length : 0;
  const r2 = tl.cov * tl.cov;
  let covered = 0;
  for (const t of T) {
    for (let i = 0; i < U.length; i++) { const dx = U[i].x - t.x, dy = U[i].y - t.y; if (dx * dx + dy * dy <= r2) { covered++; break; } }
  }
  const cov = T.length ? covered / T.length : 0;
  const score = Math.max(0, Math.min(100, Math.round(100 * acc * cov)));
  return { score, acc, cov };
}

let resultTimers = [];
function cancelResultTimers() { resultTimers.forEach(t => clearTimeout(t)); resultTimers = []; }
const later = (fn, ms) => resultTimers.push(setTimeout(fn, ms));
function finish() {
  if (!cur || cur.finished || cur.U.length < 2) return;
  clearTimeout(cur.finishTimer); stopDemo();
  cur.finished = true; active.clear(); updateDone();
  const r = scoreTrace();
  const stars = starsFor(r.score);
  const earned = r.score * tol().mult;
  const key = bestKey(cur.lv), prev = data.best[key];
  const improved = !prev || r.score > prev.score;
  if (improved) data.best[key] = { score: r.score, stars: Math.max(stars, prev ? prev.stars : 0) };
  data.points += earned;
  persist();
  showResult(r, stars, earned, improved && !!prev);
}
const MSGS = [
  ['Let’s try that again!', 'Keep going!'],
  ['Nice try!', 'Good start!'],
  ['Great job!', 'Super tracing!'],
  ['Champion tracing!', 'Wow, so steady!']
];
function showResult(r, stars, earned, newBest) {
  cancelResultTimers();
  const res = $('#result'); res.hidden = false;
  $('#scoreNum').textContent = '0';
  $('#resultMsg').textContent = MSGS[stars][(Math.random() * 2) | 0];
  const tip = $('#resultTip');
  if (stars < 3) {
    tip.hidden = false;
    tip.textContent = r.cov < 0.9 ? 'Tip: trace the whole thing and light up every dot.' : 'Tip: go slowly and keep your finger right on the line.';
  } else tip.hidden = true;
  $('#statAcc').textContent = Math.round(r.acc * 100) + '%';
  $('#statCov').textContent = Math.round(r.cov * 100) + '%';
  $('#earnedText').textContent = `+${earned} points${data.mode === 'pro' ? ' (doubled)' : ''}`;
  $('#newBest').hidden = !newBest;
  const svgs = [...$('#rstars').querySelectorAll('svg')];
  svgs.forEach(s => { s.classList.remove('on'); s.style.fill = '#e2ddef'; });
  const isLast = cur.ci === CHAPTERS.length - 1 && cur.li === CHAPTERS[cur.ci].levels.length - 1;
  $('#nextBtn').textContent = isLast ? 'All levels' : 'Next';
  Sound.noise(0.6, { vol: 0.08, f1: 200, f2: 400, q: 0.7 });
  const dur = reduceMotion ? 0 : 900, t0 = now();
  const count = () => {
    const k = dur ? Math.min(1, (now() - t0) / dur) : 1;
    const v = Math.round(r.score * (1 - Math.pow(1 - k, 3)));
    $('#scoreNum').textContent = String(v);
    if (k < 1) { Sound.tick(); later(count, 16); }
  };
  count();
  for (let i = 0; i < stars; i++) later(() => { svgs[i].style.fill = '#ffc83d'; svgs[i].classList.add('on'); Sound.ding(i); buzz(10); }, dur + 150 + i * 280);
  later(() => {
    $('#playPoints').textContent = fmt(data.points); bump($('#playPointsChip'));
    updateLevelBest();
    if (stars === 3) { Sound.fanfare(); confetti(); }
  }, dur + 200 + stars * 280);
}

/* ================= confetti ================= */
function confetti() {
  if (reduceMotion) return;
  const c = $('#confetti'), g = c.getContext('2d');
  const W = innerWidth, H = innerHeight;
  c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const cols = ['#ffc83d', '#ff4f8b', '#2fcf6b', '#5bc8f5', '#9a7bff', '#ff8a3d'];
  const parts = Array.from({ length: 110 }, () => ({ x: rand(0, W), y: rand(-H * 0.6, -10), vx: rand(-40, 40), vy: rand(120, 260), r: rand(5, 9), a: rand(0, 6.28), va: rand(-6, 6), c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = now(); let last = t0;
  const frame = () => {
    const t = now(), dt = Math.min(0.05, (t - last) / 1000); last = t;
    g.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r, -p.r * 0.45, p.r * 2, p.r * 0.9); g.restore();
    }
    if (t - t0 < 3200) requestAnimationFrame(frame); else g.clearRect(0, 0, W, H);
  };
  frame();
}

/* ================= wiring ================= */
function goHome() {
  cancelResultTimers(); stopDemo();
  if (cur) clearTimeout(cur.finishTimer);
  cur = null; active.clear();
  $('#play').hidden = true; $('#home').hidden = false;
  renderHome(); Sound.click();
}
function nextLevel() {
  if (!cur) return;
  let ci = cur.ci, li = cur.li + 1;
  if (li >= CHAPTERS[ci].levels.length) { ci++; li = 0; }
  if (ci >= CHAPTERS.length) { goHome(); return; }
  Sound.pop(); startLevel(ci, li);
}
$('#homeBtn').addEventListener('click', goHome);
$('#restartBtn').addEventListener('click', () => { if (!cur) return; Sound.whoosh(); setupLevel(); });
$('#againBtn').addEventListener('click', () => { if (!cur) return; Sound.whoosh(); setupLevel(); });
$('#nextBtn').addEventListener('click', nextLevel);
$('#showBtn').addEventListener('click', playDemo);
$('#doneBtn').addEventListener('click', () => { if (cur && !cur.finished && cur.U.length >= 2) finish(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && cur) goHome();
});
const onResize = () => {
  if ($('#play').hidden || !cur) return;
  if (cur.U && cur.U.length === 0 && !cur.finished) { cssW = 0; cssH = 0; setupLevel(); }
  else fitCanvas();
};
if ('ResizeObserver' in window) new ResizeObserver(onResize).observe(paper);
else window.addEventListener('resize', onResize);

/* ================= boot ================= */
let booted = false;
function start(snap) {
  if (booted) return; booted = true;
  snap = snap || {};
  if (TOL[snap.mode]) data.mode = snap.mode;
  if (CHAPTERS[snap.chapter]) data.chapter = snap.chapter;
  renderHome();
  if (snap.screen === 'play' && CHAPTERS[snap.ci] && CHAPTERS[snap.ci].levels[snap.li]) startLevel(snap.ci, snap.li);
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ screen: cur ? 'play' : 'home', ci: cur ? cur.ci : null, li: cur ? cur.li : null, mode: data.mode, chapter: data.chapter }));
  } catch (e) {}
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
