<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b8a57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Holiday House">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Holiday House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: fifth sibling of the kids' games. Christmas = pine-green frame with snow dots;
     Halloween (body.hw) = purple frame with orange dots; Valentine's (body.vd) = rose frame.
     Home = holiday switch, three houses (each a row of room cards), and the Workshop shelf.
     Build = Brick Builder's guided building. Decorate = a brick room, a box of decorations,
     and glowing spots where each one belongs. */
  --frame:#2b8a57;
  --frame-shade:#1c6b41;
  --ink:#231a4f;
  --key:#fffaf0;
  --gold:#ffc83d;
  --go:#2fcf6b;
  --red:#e23b3b;
  --display:"Bagel Fat One","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --dots:radial-gradient(circle at 3px 3px,rgba(255,255,255,.5) 2px,transparent 2.4px) 0 0/22px 22px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
  background:var(--dots),var(--frame);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}
.key{
  position:relative;display:grid;place-items:center;padding:0;min-width:0;cursor:pointer;flex:0 0 auto;
  background:var(--key);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
  transition:transform .09s ease,box-shadow .09s ease;touch-action:manipulation;
}
.key svg{display:block;pointer-events:none}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pill{position:relative;padding:12px 18px;border:3px solid var(--ink);border-radius:999px;background:var(--key);box-shadow:0 4px 0 var(--ink);
  font:800 17px/1 var(--body);cursor:pointer;touch-action:manipulation}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pill.primary{background:var(--red);color:#fff;-webkit-text-stroke:.4px var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border:3px solid var(--ink);border-radius:999px;background:var(--key);
  font:800 16px/1 var(--body);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
:is(.key,.pill,.room,.dec,.item):focus-visible{outline:3px solid #fff;outline-offset:3px}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{scale:1}40%{scale:1.2}100%{scale:1}}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{20%{rotate:-12deg;scale:1.15}50%{rotate:10deg;scale:1.15}80%{rotate:-6deg}100%{rotate:0;scale:1}}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;gap:14px;overflow-y:auto;touch-action:pan-y}
.title{margin:4px 0 0;font:400 clamp(42px,12.5vw,78px)/.95 var(--display);letter-spacing:1px;text-align:center}
.title .w{display:inline-block;white-space:nowrap;margin:0 .1em}
.title span span{display:inline-block;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.title span span:nth-child(3n+1){color:#ff5a5a}
.title span span:nth-child(3n+2){color:#fff}
.title span span:nth-child(3n+3){color:#ffd23f}
body.hw{
  --frame:#4b2a7b;--frame-shade:#2f1854;--red:#f07a1a;
  --dots:radial-gradient(circle at 3px 3px,rgba(255,163,72,.5) 2px,transparent 2.4px) 0 0/22px 22px;
}
body.vd{
  --frame:#d6457a;--frame-shade:#a52d5a;--red:#e8336f;
  --dots:radial-gradient(circle at 3px 3px,rgba(255,255,255,.55) 2px,transparent 2.4px) 0 0/22px 22px;
}
body.vd .title span span:nth-child(3n+1){color:#ffd1e1}
body.vd .title span span:nth-child(3n+2){color:#fff}
body.vd .title span span:nth-child(3n+3){color:#ffd23f}
body.vd .room img{background:linear-gradient(#ffe3ee,#fff4f8)}
body.vd .room img.out{background:linear-gradient(#f7a6c4,#ffe6ef)}
body.vd .dec img{background:#fff0f6}
body.vd #build.make #stage{background:linear-gradient(#ffc1d8,#fff0f6 75%)}
body.vd #build.deco.in #stage{background:linear-gradient(#ffe3ee,#fff4f8 70%)}
body.vd #build.deco.out #stage{background:linear-gradient(#f7a6c4,#ffe6ef 70%)}
body.vd .mark{border-color:#e8336f}
body.vd .mark::after{background:#ff4f8b}
body.hw .title span span:nth-child(3n+1){color:#ff8a1e}
body.hw .title span span:nth-child(3n+2){color:#b8f25a}
body.hw .title span span:nth-child(3n+3){color:#efe4ff}
.seasons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(100%,460px);margin:0 auto;flex:0 0 auto}
.season{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;cursor:pointer;touch-action:manipulation;min-width:0;
  background:var(--key);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);font:800 15px/1.1 var(--body);transition:transform .1s}
.season span{white-space:nowrap}
.season img{width:46px;height:46px;object-fit:contain;border-radius:50%;background:#fff}
.season[aria-checked="true"]{background:var(--gold);transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.season:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.house{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.house-head{display:flex;align-items:center;gap:10px;color:#fff;padding:0 2px}
.house-head h2{margin:0;font:400 26px/1 var(--display);letter-spacing:.4px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;white-space:nowrap}
.house-head .chip{color:var(--ink)}
.house-head .star{width:24px;height:24px;flex:0 0 auto}
.scenes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(148px,46%);gap:12px;overflow-x:auto;overflow-y:hidden;padding:4px 4px 12px;
  scroll-snap-type:x proximity;scrollbar-width:none;touch-action:pan-x pan-y}
.scenes::-webkit-scrollbar{display:none}
.room{position:relative;display:flex;flex-direction:column;gap:4px;padding:6px 6px 10px;cursor:pointer;text-align:left;touch-action:manipulation;scroll-snap-align:start;
  background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
.room:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.room img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:linear-gradient(#ffe9c7,#fff6e6);display:block}
.room img.out{background:linear-gradient(#7fb6e8,#d9ecfb)}
body.hw .room img{background:linear-gradient(#2c1d4a,#4a3570)}
body.hw .room img.out{background:radial-gradient(circle at 80% 18%,#fff6c9 0 9px,transparent 10px),linear-gradient(#140d33,#3d2466)}
.room b{font:400 20px/1 var(--display);letter-spacing:.3px;padding:0 4px}
.room .meta{display:flex;align-items:center;gap:6px;padding:0 4px;font:800 14px/1 var(--body);font-variant-numeric:tabular-nums}
.bar-mini{flex:1 1 auto;height:10px;border-radius:5px;border:2px solid var(--ink);background:#eee;overflow:hidden}
.bar-mini i{display:block;height:100%;width:0;background:var(--red)}
.room .done{position:absolute;top:-10px;right:-8px;padding:5px 10px;border-radius:999px;background:var(--gold);border:3px solid var(--ink);font:800 13px/1 var(--body)}
.shop-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;color:#fff}
.shop-head h2{margin:0;font:400 30px/1 var(--display);letter-spacing:.4px;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.shop-head p{margin:0;font:700 15px/1.3 var(--body)}
#shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding-bottom:20px;flex:0 0 auto}
.dec{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px 8px;cursor:pointer;touch-action:manipulation;
  background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.dec:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.dec img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:12px;background:#eef7ff}
body.hw .dec img{background:#efe6fb}
.dec .nm{font:800 14px/1.1 var(--body);text-align:center}
.dec .tag{position:absolute;top:-9px;right:-9px;padding:4px 8px;border-radius:999px;border:2px solid var(--ink);font:800 12px/1 var(--body);background:var(--red);color:#fff}
.dec .tag.ok{background:var(--gold);color:var(--ink)}
.dec .times{position:absolute;top:8px;left:8px;padding:2px 7px;border-radius:999px;background:var(--ink);color:#fff;font:800 12px/1.3 var(--body)}

/* ---------- build / decorate ---------- */
#build{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"head" "side" "stage" "tools";gap:10px}
.top{grid-area:head;display:flex;align-items:center;gap:8px;min-width:0}
.top .key{width:48px;height:46px}
.top .key svg{width:64%;height:64%}
.grow{flex:1 1 4px;min-width:2px}
.title-pill{display:flex;align-items:center;gap:10px;min-width:0;padding:6px 12px;border:3px solid var(--ink);border-radius:16px;background:var(--key);box-shadow:0 3px 0 var(--ink)}
#bName{font:400 19px/1 var(--display);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:relative;width:74px;height:22px;border-radius:999px;border:2px solid var(--ink);background:#fff;overflow:hidden;flex:0 0 auto}
.prog i{position:absolute;inset:0;width:0;background:var(--go);transition:width .25s}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font:800 13px/1 var(--body);font-variant-numeric:tabular-nums}
#side{grid-area:side;min-width:0}
#bar{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;padding:10px 4px 8px;min-height:92px}
#bar::-webkit-scrollbar{display:none}
.item{
  position:relative;flex:0 0 auto;width:72px;height:72px;display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none;
  border:3px solid var(--ink);border-radius:16px;background:var(--key);box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background-color .15s,opacity .2s;
}
.item img{width:62px;height:62px;pointer-events:none;-webkit-user-drag:none;object-fit:contain}
.item .n{position:absolute;top:-9px;right:-9px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--ink);color:#fff;border:2px solid #fff;font:800 14px/22px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.item.ready{background:#e3ffe9;box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px #7fe0a0}
.item.later{opacity:.45}
.item.locked{opacity:.55;background:#eee}
.item.locked .n{background:var(--red)}
.item.used{opacity:.35}
.item[aria-pressed="true"]{background:var(--gold);transform:translateY(-4px);box-shadow:0 8px 0 var(--ink)}
#stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;border:3px solid var(--ink);border-radius:24px;background:linear-gradient(#8fd0ff,#e6f6ff 75%);box-shadow:0 6px 0 var(--frame-shade)}
#build.deco.in #stage{background:linear-gradient(#ffe9c7,#fff6e6 70%)}
#build.deco.out #stage{background:linear-gradient(#7fb6e8,#d9ecfb 70%)}
body.hw #build.make #stage{background:linear-gradient(#a98bd8,#efe6fb 75%)}
body.hw #build.deco.in #stage{background:linear-gradient(#2c1d4a,#4a3570 70%)}
body.hw #build.deco.out #stage{background:radial-gradient(circle at 84% 14%,#fff6c9 0 24px,rgba(255,246,201,.22) 25px 38px,transparent 39px),linear-gradient(#140d33,#3d2466 75%)}
body.hw .mark{border-color:#f07a1a}
body.hw .mark::after{background:#ff8a1e}
#gl,#snow{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none}
#snow{pointer-events:none}
#marks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.88);border:3px dashed #e9a800;animation:twinkle 1.6s ease-in-out infinite}
.mark::after{content:"";width:12px;height:12px;background:#ffc83d;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.mark.dim{opacity:.35;animation:none}
@keyframes twinkle{50%{transform:scale(1.18)}}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:700 18px/1.4 var(--body)}
.tools{grid-area:tools;display:flex;align-items:center;gap:8px}
.tools .key{width:56px;height:54px;border-radius:18px}
.tools .key svg{width:62%;height:62%}
.tools .wide{width:auto;padding:0 16px 0 10px;display:flex;gap:6px;font:800 17px/1 var(--body)}
.tools .wide svg{width:30px;height:30px}
#build.make .deco-only,#build.deco .make-only{display:none}
.hold{overflow:hidden}
.hold .fill{position:absolute;inset:0;background:rgba(226,59,59,.45);transform:scaleY(0);transform-origin:bottom;pointer-events:none}
.hold.holding .fill{transform:scaleY(1);transition:transform 800ms linear}

#done{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:linear-gradient(transparent 40%,rgba(35,26,79,.2))}
.dcard{width:min(100%,440px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 14px 16px;text-align:center;
  background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);animation:rise .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.dcard h2{margin:0;font:400 26px/1.05 var(--display);letter-spacing:.3px;text-wrap:balance}
.dcard p{margin:0;font:700 15px/1.3 var(--body)}
.dcard .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
#build.finished #side{display:none}
#dragImg{position:fixed;z-index:60;width:80px;height:80px;margin:-40px 0 0 -40px;pointer-events:none;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(35,26,79,.35))}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#toast{
  position:fixed;z-index:70;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);width:max-content;max-width:calc(100vw - 28px);
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:18px;background:var(--ink);color:#fff;font:700 16px/1.25 var(--body);text-align:center;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease;
}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast button{flex:0 0 auto;border:2px solid #fff;background:var(--gold);color:var(--ink);font:800 15px/1 var(--body);padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
#toast.show button{pointer-events:auto}
@media (orientation: landscape) and (max-height: 600px){
  #build{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "side stage" "side tools"}
  #side{height:100%;min-height:0}
  #bar{flex-direction:column;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;padding:8px 10px 8px 4px;min-height:0;height:100%;width:96px}
  .rooms{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion: reduce){
  .bump,.wiggle,.dcard,.mark{animation:none}
  .key,.pill,.item,#toast{transition:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.3l-6 3.4 1.3-6.8-5-4.7 6.8-.8z" fill="#ffc83d" stroke="#231a4f" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 48 48"><path d="M7 24 24 9l17 15" fill="none" stroke="#231a4f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21v19h24V21" fill="#ffc83d" stroke="#231a4f" stroke-width="3.5" stroke-linejoin="round"/><path d="M20 40V30h8v10" fill="#ff7aa8" stroke="#231a4f" stroke-width="3" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<!-- ================= HOME ================= -->
<section id="home" class="screen" aria-label="Holiday House">
  <h1 class="title" id="title" aria-label="Christmas House"></h1>
  <div class="seasons" role="radiogroup" aria-label="Holiday">
    <button class="season" type="button" role="radio" data-s="xmas" aria-checked="true"><img alt=""><span>Christmas</span></button>
    <button class="season" type="button" role="radio" data-s="hw" aria-checked="false"><img alt=""><span>Halloween</span></button>
    <button class="season" type="button" role="radio" data-s="vday" aria-checked="false"><img alt=""><span>Valentine's</span></button>
  </div>
  <div id="houses"></div>
  <div class="shop-head"><h2>Workshop</h2><p id="shopHint">Build decorations, then put them up!</p></div>
  <div id="shop"></div>
</section>

<!-- ================= BUILD + DECORATE ================= -->
<section id="build" class="screen make" aria-label="Building" hidden>
  <header class="top">
    <button id="homeBtn" class="key" type="button" aria-label="Back home" title="Home"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-home"/></svg></button>
    <div class="title-pill"><span id="bName">Stocking</span><span class="prog" id="bProg"><i></i><b>0 / 0</b></span></div>
    <span class="grow"></span>
  </header>
  <div id="side"><div id="bar" role="toolbar" aria-label="Pieces"></div></div>
  <main id="stage">
    <canvas id="gl" aria-label="3D view. Drag to spin, pinch to zoom."></canvas>
    <canvas id="snow" aria-hidden="true"></canvas>
    <div id="marks"></div>
    <div id="nogl" hidden>This device can't show 3D right now. Try a newer browser.</div>
    <div id="done" hidden>
      <div class="dcard" role="dialog" aria-labelledby="doneTitle">
        <svg width="120" height="40" viewBox="0 0 72 24" aria-hidden="true"><use href="#i-star" x="0" width="24" height="24"/><use href="#i-star" x="24" width="24" height="24"/><use href="#i-star" x="48" width="24" height="24"/></svg>
        <h2 id="doneTitle">You made it!</h2>
        <p id="doneText">It's in your box. Go put it up!</p>
        <div class="acts" id="doneActs"></div>
      </div>
    </div>
  </main>
  <nav class="tools" aria-label="Tools">
    <button id="helpBtn" class="key wide make-only" type="button" aria-label="Show me where">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6a13 13 0 0 0-8 23.3V34h16v-4.7A13 13 0 0 0 24 6z" fill="#ffd23f" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M18 39h12M20 44h8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
      Help
    </button>
    <button id="swapBtn" class="key wide deco-only" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="11" y="5" width="22" height="38" rx="2" fill="#ff7aa8" stroke="currentColor" stroke-width="3.5"/><circle cx="27" cy="25" r="2.6" fill="currentColor"/><path d="M36 17l7 7-7 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="swapLabel">Kitchen</span>
    </button>
    <span class="grow"></span>
    <button id="viewBtn" class="key" type="button" aria-label="Reset the view" title="Reset the view">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="15" fill="#bfe8ff" stroke="currentColor" stroke-width="3.5"/><path d="M24 4v8M24 36v8M4 24h8M36 24h8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="24" cy="24" r="4" fill="currentColor"/></svg>
    </button>

const Sound = {
  ac: null, master: null, unlocked: false,
  unlock() {

      if (this.ac.state === 'suspended') { const p = this.ac.resume(); if (p && p.catch) p.catch(() => {}); }
      if (!this.unlocked) { const b = this.ac.createBuffer(1, 1, 22050), s = this.ac.createBufferSource(); s.buffer = b; s.connect(this.ac.destination); s.start(0); this.unlocked = true; }
    } catch (e) {}
  },
  ok() { return this.ac && this.ac.state !== 'closed'; },
  tone(f, dur, o = {}) {
    if (!this.ok()) return;

      const { type = 'sine', vol = 0.12, to = null, delay = 0 } = o, t = this.ac.currentTime + delay;
      const osc = this.ac.createOscillator(), g = this.ac.createGain();
      osc.type = type; osc.frequency.setValueAtTime(f, t); if (to) osc.frequency.exponentialRampToValueAtTime(to, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(this.master); osc.start(t); osc.stop(t + dur + 0.03);
    } catch (e) {}
  },
  noise(dur, o = {}) {
    if (!this.ok()) return;
    try {
      const { vol = 0.15, f1 = 800, f2 = 3000, q = 1.2, delay = 0 } = o, ac = this.ac;
      const n = Math.max(1, Math.floor(ac.sampleRate * dur)), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
      const t = ac.currentTime + delay; bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.01, dur * 0.25)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    } catch (e) {}
  },
  clack() { this.noise(0.05, { vol: 0.32, f1: 3200, f2: 1800, q: 1.6 }); this.tone(rand(300, 360), 0.07, { type: 'triangle', vol: 0.12, to: 180 }); },
  pop() { this.tone(rand(320, 420), 0.12, { to: rand(900, 1200), vol: 0.13 }); },
  click() { this.tone(880, 0.06, { type: 'triangle', vol: 0.06 }); },
  bonk() { this.tone(220, 0.18, { to: 150, vol: 0.09 }); },
  poof() { this.noise(0.22, { vol: 0.2, f1: 1500, f2: 300, q: 0.9 }); },
  layer() { [784, 988, 1175].forEach((f, i) => this.tone(f, 0.22, { type: 'triangle', vol: 0.09, delay: i * 0.07 })); },
  fanfare() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.35, { type: 'triangle', vol: 0.1, delay: i * 0.1 })); [523.25, 659.25, 783.99, 1046.5].forEach(f => this.tone(f, 0.9, { type: 'triangle', vol: 0.05, delay: 0.45 })); },

let toastTimer = 0;
function toast(msg, ms = 2400, action) {
  const t = $('#toast'), b = t.querySelector('button');
  t.querySelector('.msg').textContent = msg;
  if (action) { b.hidden = false; b.textContent = action.label; b.onclick = () => { t.classList.remove('show'); action.fn(); }; }
  else { b.hidden = true; b.onclick = null; }
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), action ? 6500 : ms);
}

/* =====================================================================
   Screens
   ===================================================================== */
function showDone(title, text, acts) {
  $('#doneTitle').textContent = title; $('#doneText').textContent = text;
  const boxEl = $('#doneActs'); boxEl.textContent = '';
  for (const a of acts) { const b = document.createElement('button'); b.type = 'button'; b.className = 'pill' + (a.primary ? ' primary' : ''); b.textContent = a.label; b.addEventListener('click', () => { Sound.pop(); a.fn(); }); boxEl.appendChild(b); }

function showBuild() {
  applyTheme();
  $('#home').hidden = true; $('#build').hidden = false; $('#done').hidden = true;
  const b = $('#build');
  b.classList.toggle('make', mode === 'make'); b.classList.toggle('deco', mode === 'deco');
  b.classList.remove('finished', 'in', 'out');

/* =====================================================================
   Confetti
   ===================================================================== */
let confettiParts = [], confettiOn = false;
function confetti(count = 130, x, y) {
  if (reduceMotion) return;
  const c = $('#confetti'), g = c.getContext('2d'), W = innerWidth, Hh = innerHeight;
  if (c.width !== Math.round(W * DPR)) { c.width = Math.round(W * DPR); c.height = Math.round(Hh * DPR); }
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const cols = SEASONS[SEA].confetti;
  for (let i = 0; i < count; i++) {
    const at = x != null, a = rand(0, TAU), sp = rand(120, 300);
    confettiParts.push({ x: at ? x : rand(0, W), y: at ? y : rand(-Hh * 0.5, -10), vx: at ? Math.cos(a) * sp : rand(-40, 40), vy: at ? Math.sin(a) * sp - 120 : rand(120, 260),

  };
  step();
}

(() => {
  const btn = $('#downBtn'); let timer = 0, fired = false;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); fired = false; btn.classList.add('holding'); try { btn.setPointerCapture(e.pointerId); } catch (_) {} timer = setTimeout(() => { timer = 0; fired = true; btn.classList.remove('holding'); takeDown(); }, 800); });

let booted = false;
function boot(snap) {
  if (booted) return; booted = true;

  renderHome();
  if (!R) $('#houses').insertAdjacentHTML('beforebegin', '<p style="margin:0;color:#fff;font:700 17px/1.4 var(--body)">This device can\'t show 3D right now. Try a newer browser.</p>');
