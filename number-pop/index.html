<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8f6bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Number Pop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Number Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Bagel+Fat+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: fourth sibling of the kids' games. Grape-purple toy frame; home = a stack of
     problem-kind cards; play = one white problem card with pictures and three big answer bubbles. */
  --frame:#8f6bff;
  --frame-shade:#6a45e3;
  --ink:#231a4f;
  --key:#fffaf0;
  --gold:#ffc83d;
  --go:#2fcf6b;
  --pop:#ff4f8b;
  --display:"Bagel Fat One","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --num:"Andika","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;  /* made for beginning readers: plain, clear digits */
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --dots:radial-gradient(circle at 2px 2px,rgba(255,255,255,.3) 1.6px,transparent 1.9px) 0 0/16px 16px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
  background:var(--dots),var(--frame);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}
.key{
  position:relative;display:grid;place-items:center;padding:0;min-width:0;cursor:pointer;flex:0 0 auto;width:48px;height:46px;
  background:var(--key);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
  transition:transform .09s ease,box-shadow .09s ease;touch-action:manipulation;
}
.key svg{width:64%;height:64%;display:block;pointer-events:none}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border:3px solid var(--ink);border-radius:999px;background:var(--key);
  font:800 16px/1 var(--body);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip svg{width:22px;height:22px;flex:0 0 auto}
button.chip{cursor:pointer;touch-action:manipulation}
button.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button.chip[aria-pressed="false"]{opacity:.6;text-decoration:line-through}
.pill{position:relative;padding:12px 22px;border:3px solid var(--ink);border-radius:999px;background:var(--key);box-shadow:0 4px 0 var(--ink);
  font:800 18px/1 var(--body);cursor:pointer;touch-action:manipulation}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pill.primary{background:var(--go);color:#fff;-webkit-text-stroke:.4px var(--ink)}
:is(.key,.pill,.chip,.mode,.mix,.bub,.side,.obj,.cell):focus-visible{outline:3px solid #fff;outline-offset:3px}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{scale:1}40%{scale:1.25}100%{scale:1}}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;gap:14px;overflow-y:auto;touch-action:pan-y}
.home-head{display:flex;flex-direction:column;align-items:center;gap:10px}
.title{margin:4px 0 0;font:400 clamp(50px,15vw,88px)/.95 var(--display);letter-spacing:1px;text-align:center}
.title .w{display:inline-block;white-space:nowrap;margin:0 .1em}
.title span span{display:inline-block;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.title span span:nth-child(5n+1){color:#ffd23f}
.title span span:nth-child(5n+2){color:#ff7aa8}
.title span span:nth-child(5n+3){color:#7cf0a5}
.title span span:nth-child(5n+4){color:#8fd8ff}
.title span span:nth-child(5n+5){color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mix{
  display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;text-align:left;flex:0 0 auto;touch-action:manipulation;
  background:linear-gradient(135deg,#fff7c2,#ffe07a);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);
}
.mix:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.mix .art{display:flex;gap:6px;flex:0 0 auto}
.mix .art i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);font:700 26px/1 var(--num);font-style:normal;color:var(--ink)}
.mix b{display:block;font:400 28px/1 var(--display);letter-spacing:.4px}
.mix small{display:block;font:700 15px/1.25 var(--body);margin-top:4px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;flex:0 0 auto}
.mode{
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 12px 10px;cursor:pointer;text-align:left;touch-action:manipulation;
  background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);
}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.mode .ex{align-self:stretch;display:grid;place-items:center;height:64px;border-radius:14px;background:var(--c);border:3px solid var(--ink);
  font:700 32px/1 var(--num);color:var(--ink);letter-spacing:1px;white-space:nowrap}
.mode .ex.emo{font:400 26px/1 var(--emoji);-webkit-text-stroke:0;letter-spacing:-2px}
.mode .nm{font:800 17px/1.1 var(--body)}
.lv{display:inline-flex;gap:4px}
.lv i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.mode-pill .lv i{width:9px;height:9px}
.lv i.on{background:var(--gold)}
.settings{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-bottom:6px}

/* ---------- play ---------- */
#play{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.grow{flex:1 1 4px;min-width:2px}
.mode-pill{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-width:0;min-height:46px;padding:4px 10px;border:3px solid var(--ink);border-radius:16px;background:var(--key);box-shadow:0 3px 0 var(--ink)}
#pName{max-width:100%;font:400 16px/1 var(--display);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jar{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border:3px solid var(--ink);border-radius:999px;background:var(--key);box-shadow:0 3px 0 var(--ink);font:800 15px/1 var(--body);font-variant-numeric:tabular-nums}
.jar svg{width:24px;height:24px}
.jar i{display:none;position:relative;width:40px;height:10px;border-radius:5px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.jar s{position:absolute;inset:0;width:0;background:var(--gold);text-decoration:none;transition:width .3s}
#card{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 12px 18px;
  background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--frame-shade);overflow:hidden;
}
.prompt{margin:0;min-height:56px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;text-align:center;
  font:700 clamp(30px,9.5vw,46px)/1.1 var(--num);text-wrap:balance}
.prompt .em{font-family:var(--emoji);font-size:.9em}
.tok{display:inline-grid;place-items:center;min-width:.7em}
.tok.q{min-width:1.3em;padding:0 .12em;border:4px dashed #b5a3ff;border-radius:16px;color:#b5a3ff;animation:qpulse 1.4s ease-in-out infinite}
.tok.q.filled{border-style:solid;border-color:var(--go);color:var(--go);background:#e6fff0;animation:none}
@keyframes qpulse{50%{transform:scale(1.08)}}
.visual{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;--s:44px}
.grp{display:grid;grid-template-columns:repeat(var(--cols,5),var(--s));gap:6px;justify-content:center;padding:8px;border-radius:18px;background:#f4f0ff}
.op{font:700 calc(var(--s) * 1.1)/1 var(--num);color:var(--ink)}
.obj{position:relative;display:grid;place-items:center;width:var(--s);height:var(--s);padding:0;border:0;background:none;cursor:pointer;
  font:400 calc(var(--s) * .82)/1 var(--emoji);touch-action:manipulation;transition:transform .15s}
.obj:active{transform:scale(.9)}
.obj.gone{opacity:.28;filter:grayscale(1)}
.obj.gone::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:5px;margin-top:-2px;border-radius:3px;background:#ff4f6d;rotate:-35deg}
.obj .n{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:var(--pop);color:#fff;border:2px solid var(--ink);
  font:800 14px/20px var(--body);text-align:center;animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
.frame{display:grid;grid-template-columns:repeat(5,var(--s));gap:0;border:4px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.cell{position:relative;width:var(--s);height:var(--s);border:2px solid #cfc4ff;display:grid;place-items:center;padding:0;background:#fff;cursor:pointer;touch-action:manipulation}
.cell b{width:72%;height:72%;border-radius:50%;background:#ff4f6d;border:3px solid var(--ink)}
.cell .n{position:absolute;inset:auto auto 4px auto;font:800 16px/1 var(--body);color:var(--frame-shade)}
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seq span{display:grid;place-items:center;width:clamp(58px,17vw,76px);height:clamp(64px,19vw,84px);border:3px solid var(--ink);border-radius:16px;background:#f4f0ff;
  font:700 clamp(32px,9.5vw,44px)/1 var(--num)}
.seq span.miss{background:#fff;border:4px dashed #b5a3ff;color:#b5a3ff;animation:qpulse 1.4s ease-in-out infinite}
.seq span.miss.filled{border-style:solid;border-color:var(--go);color:var(--go);background:#e6fff0;animation:none}
.seq span.lit{background:var(--gold)}
.side{
  flex:1 1 0;min-width:0;max-width:220px;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 8px;cursor:pointer;
  background:#f4f0ff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);touch-action:manipulation;transition:transform .1s
}
.side:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.side .grp{background:transparent;padding:0;pointer-events:none}
.side .big{font:700 clamp(60px,19vw,88px)/1 var(--num);color:var(--ink)}
.side.right{background:#e6fff0;border-color:var(--go);box-shadow:0 5px 0 var(--go)}
.side.wrong{animation:shake .45s;opacity:.45}
.praise{position:absolute;left:50%;top:42%;z-index:5;padding:10px 20px;border:3px solid var(--ink);border-radius:999px;background:var(--gold);box-shadow:0 5px 0 var(--ink);
  font:400 clamp(26px,8vw,36px)/1 var(--display);letter-spacing:.4px;white-space:nowrap;transform:translate(-50%,-50%);animation:cheer .5s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
@keyframes cheer{from{transform:translate(-50%,-50%) scale(.3)}}
.answers{display:flex;gap:clamp(10px,4vw,22px);justify-content:center;flex:0 0 auto;padding-top:4px}
.bub{
  display:grid;place-items:center;width:clamp(80px,25vw,108px);aspect-ratio:1;padding:0;border-radius:50%;cursor:pointer;touch-action:manipulation;
  background:var(--c);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink),inset -9px -11px 0 rgba(0,0,0,.09),inset 9px 9px 0 rgba(255,255,255,.4);
  font:700 clamp(42px,13vw,58px)/1 var(--num);color:var(--ink);transition:transform .1s
}
.bub:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.bub.wrong{animation:shake .45s;opacity:.35;filter:grayscale(1);pointer-events:none}
.bub.right{animation:popOut .55s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes shake{20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(6deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes popOut{40%{transform:scale(1.3)}100%{transform:scale(1.12);background:#8fe8ad}}

/* ---------- sticker book + reward ---------- */
#book{display:flex;flex-direction:column;gap:12px}
#book h2{margin:0;font:400 clamp(28px,8vw,38px)/1 var(--display);letter-spacing:.5px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.stickers{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px;padding:6px 4px 20px;align-content:start}
.stk{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:400 40px/1 var(--emoji)}
.stk.locked{background:rgba(255,255,255,.35);font:400 30px/1 var(--display);color:rgba(35,26,79,.4);box-shadow:none;border-style:dashed}
.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(35,26,79,.45)}
.rcard{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 26px 22px;background:#fff;border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);text-align:center;animation:rise .4s cubic-bezier(.3,1.5,.5,1)}
.rcard h2{margin:0;font:400 30px/1.05 var(--display);letter-spacing:.4px}
.big-sticker{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:radial-gradient(#fff6c9,#ffd23f);border:4px solid var(--ink);font:400 92px/1 var(--emoji);animation:spinIn .8s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
@keyframes spinIn{from{transform:scale(.2) rotate(-200deg)}}
.flyer{position:fixed;z-index:85;width:34px;height:34px;pointer-events:none;transition:transform .65s cubic-bezier(.5,-0.3,.6,1),opacity .65s ease-in}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#toast{
  position:fixed;z-index:95;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);width:max-content;max-width:calc(100vw - 28px);
  padding:10px 16px;border-radius:18px;background:var(--ink);color:#fff;font:700 17px/1.25 var(--body);text-align:center;
  transform:translate(-50%,-14px);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease;
}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion: reduce){
  .bump,.tok.q,.seq span.miss,.bub.right,.bub.wrong,.side.wrong,.rcard,.big-sticker,.obj .n{animation:none}
  .flyer,#toast{transition:none}
}
@media (orientation: landscape) and (max-height: 520px){
  #card{flex-direction:row;flex-wrap:wrap;align-content:center}
  .prompt{width:100%;min-height:0}
  .visual{flex:1 1 55%}
  .answers{flex-direction:column}
  .bub{width:70px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.3l-6 3.4 1.3-6.8-5-4.7 6.8-.8z" fill="#ffc83d" stroke="#231a4f" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 48 48"><path d="M7 24 24 9l17 15" fill="none" stroke="#231a4f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21v19h24V21" fill="#ffc83d" stroke="#231a4f" stroke-width="3.5" stroke-linejoin="round"/><path d="M20 40V30h8v10" fill="#ff7aa8" stroke="#231a4f" stroke-width="3" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<!-- ================= HOME ================= -->
<section id="home" class="screen" aria-label="Pick a kind of problem">
  <header class="home-head">
    <h1 class="title" aria-label="Number Pop"><span class="w" aria-hidden="true"><span>N</span><span>u</span><span>m</span><span>b</span><span>e</span><span>r</span></span><span class="w" aria-hidden="true"><span>P</span><span>o</span><span>p</span></span></h1>
    <div class="row">
      <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg><span><b id="hStars">0</b> stars</span></span>
      <button id="bookBtn" class="chip" type="button"><span aria-hidden="true" style="font:400 20px/1 var(--emoji)">🦄</span>Sticker Book <b id="hStick">0</b></button>
    </div>
  </header>
  <button id="mixBtn" class="mix" type="button">
    <span class="art" aria-hidden="true"><i style="background:#ff7aa8">1</i><i style="background:#5bc8f5">+</i><i style="background:#7be08d">2</i></span>
    <span><b>Mix it up!</b><small>A little of everything</small></span>
  </button>
  <div id="modes" class="modes"></div>
  <div class="settings">
    <button id="sfxBtn" class="chip" type="button" aria-pressed="true"><span aria-hidden="true" style="font:400 18px/1 var(--emoji)">🔔</span>Sounds</button>
  </div>
</section>

<!-- ================= PLAY ================= -->
<section id="play" class="screen" aria-label="Math problems" hidden>
  <header class="bar">
    <button id="homeBtn" class="key" type="button" aria-label="Back to the start" title="Home"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-home"/></svg></button>
    <div class="mode-pill"><span id="pName">Adding</span><span class="lv" id="pLv" aria-hidden="true"></span></div>
    <span class="jar" id="jar" aria-label="Stars toward the next sticker"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg><b id="jarText">0/10</b><i><s id="jarFill"></s></i></span>
  </header>
  <main id="card" style="position:relative">
    <div id="praise" class="praise" hidden></div>
    <h2 id="prompt" class="prompt" aria-live="polite"></h2>
    <div id="visual" class="visual"></div>
    <div id="answers" class="answers" role="group" aria-label="Answers"></div>
  </main>
</section>

<!-- ================= STICKER BOOK ================= -->
<section id="book" class="screen" aria-label="Sticker book" hidden>
  <header class="bar">
    <button id="bookBack" class="key" type="button" aria-label="Back to the start" title="Home"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-home"/></svg></button>
    <h2>Sticker Book</h2>
    <span class="grow"></span>
    <span class="chip" id="bookCount">0 / 0</span>
  </header>
  <p style="margin:0;font:700 16px/1.35 var(--body);color:#fff">Every 10 stars gets a new sticker!</p>
  <div id="stickers" class="stickers"></div>
</section>

<div id="reward" class="overlay" hidden>
  <div class="rcard" role="dialog" aria-labelledby="rTitle">
    <div id="rSticker" class="big-sticker" aria-hidden="true">🦄</div>
    <h2 id="rTitle">A new sticker!</h2>
    <button id="rOk" class="pill primary" type="button">Yay!</button>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const now = () => performance.now();
const rand = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* =====================================================================
   Things to count, stickers, words
   ===================================================================== */
const THINGS = [
  ['🍎', 'apples'], ['🐞', 'ladybugs'], ['⭐', 'stars'], ['🐟', 'fish'], ['🍓', 'strawberries'], ['🦆', 'ducks'], ['🚗', 'cars'], ['🎈', 'balloons'],
  ['🐶', 'puppies'], ['🍪', 'cookies'], ['🌸', 'flowers'], ['🐸', 'frogs'], ['🍩', 'donuts'], ['🦋', 'butterflies'], ['🐝', 'bees'], ['🐥', 'chicks'],
  ['🍌', 'bananas'], ['⚽', 'balls'], ['🐢', 'turtles'], ['🧁', 'cupcakes']
];

  },
  add(lv) {

function renderHome() {
  $('#hStars').textContent = String(data.stars);
  $('#hStick').textContent = `${data.stickers.length}/${STICKERS.length}`;
  const box = $('#modes'); box.textContent = '';
  for (const m of MODES) {
    const b = el('button', 'mode'); b.type = 'button';
    const lv = lvl(m.id).lv;
    b.setAttribute('aria-label', `${m.name}, level ${lv} of 3`);
    const ex = el('span', 'ex' + (m.emo ? ' emo' : ''), m.ex); ex.style.setProperty('--c', m.c); ex.setAttribute('aria-hidden', 'true');
    const lvEl = el('span', 'lv'); lvEl.innerHTML = [1, 2, 3].map(i => `<i class="${i <= lv ? 'on' : ''}"></i>`).join('');
    b.append(ex, el('span', 'nm', m.name), lvEl);
    b.addEventListener('click', () => start(m.id));
    box.appendChild(b);
  }
  $('#sfxBtn').setAttribute('aria-pressed', String(data.sfx));
}
function start(m) { mode = m; Sound.pop(); show('play'); newProblem(); }
function goHome() { clearTimers(); P = null; $('#reward').hidden = true; show('home'); renderHome(); }
function renderBook() {
  const box = $('#stickers'); box.textContent = '';
  for (const s of STICKERS) {
    const has = data.stickers.includes(s);
    const d = el('div', 'stk' + (has ? '' : ' locked'), has ? s : '?');
    d.setAttribute('aria-label', has ? 'Sticker' : 'Not found yet');
    box.appendChild(d);
  }
  $('#bookCount').textContent = `${data.stickers.length} / ${STICKERS.length}`;
}
$('#mixBtn').addEventListener('click', () => start('mix'));
$('#homeBtn').addEventListener('click', () => { Sound.pop(); goHome(); });
$('#bookBtn').addEventListener('click', () => { Sound.pop(); renderBook(); show('book'); });
$('#bookBack').addEventListener('click', () => { Sound.pop(); goHome(); });
$('#sfxBtn').addEventListener('click', () => { data.sfx = !data.sfx; persist(); renderHome(); Sound.pop(); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if ($('#play').hidden || !P || locked) return;
  const n = parseInt(e.key, 10);
  if (!P.compare && !isNaN(n)) { const b = [...document.querySelectorAll('.bub')].find(x => x.textContent === String(n)); if (b) b.click(); }
  if (e.key === 'Escape') goHome();
});

/* =====================================================================
   Boot
   ===================================================================== */
let booted = false;
function boot(snap) {
  if (booted) return; booted = true;
  renderHome();
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ screen: $('#play').hidden ? 'home' : 'play', mode }));
  } catch (e) {}
  if (snap && snap.screen === 'play' && (snap.mode === 'mix' || MODES.some(m => m.id === snap.mode))) { mode = snap.mode; show('play'); newProblem(); }
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot);
else boot((hot && hot.data) || {});
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { try { navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {}); } catch (e) {} });
}
</script>
