<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff9b42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brick Builder">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Brick Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: third sibling of Rainbow Doodle and Trace Champ. Orange toy frame.
     Home = a wall of model cards; build = header, piece bar (top in portrait, side in landscape),
     a sky-blue 3D stage, and a tool row. */
  --frame:#ff9b42;
  --frame-shade:#dc7418;
  --ink:#231a4f;
  --key:#fffaf0;
  --gold:#ffc83d;
  --go:#2fcf6b;
  --pop:#ff4f8b;
  --display:"Bagel Fat One","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --dots:radial-gradient(circle at 2px 2px,rgba(255,255,255,.38) 1.6px,transparent 1.9px) 0 0/16px 16px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;
  background:var(--dots),var(--frame);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.screen{position:absolute;inset:0;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px)}

.key{
  position:relative;display:grid;place-items:center;padding:0;min-width:0;cursor:pointer;flex:0 0 auto;
  background:var(--key);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);
  transition:transform .09s ease,box-shadow .09s ease,background-color .15s ease;touch-action:manipulation;
}
.key svg{display:block;pointer-events:none}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key[aria-pressed="true"]{background:var(--gold);transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.key:focus-visible,.pill:focus-visible,.card:focus-visible,.tab:focus-visible,.item:focus-visible,.sw:focus-visible,.free-card:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pill{
  position:relative;padding:12px 18px;border:3px solid var(--ink);border-radius:999px;background:var(--key);box-shadow:0 4px 0 var(--ink);
  font:800 17px/1 var(--body);cursor:pointer;touch-action:manipulation;transition:transform .09s,box-shadow .09s;
}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pill.primary{background:var(--go);color:#fff;-webkit-text-stroke:.4px var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border:3px solid var(--ink);border-radius:999px;background:var(--key);
  font:800 16px/1 var(--body);font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip svg{width:22px;height:22px}
.bump{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{scale:1}40%{scale:1.2}100%{scale:1}}
.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{20%{rotate:-12deg;scale:1.15}50%{rotate:10deg;scale:1.15}80%{rotate:-6deg}100%{rotate:0;scale:1}}

/* ---------- home ---------- */
#home{display:flex;flex-direction:column;gap:12px}
.home-head{display:flex;flex-direction:column;align-items:center;gap:8px}
.title{margin:2px 0 0;font:400 clamp(44px,13vw,80px)/.95 var(--display);letter-spacing:1px;text-align:center}
.title .w{display:inline-block;white-space:nowrap;margin:0 .1em}
.title span span{display:inline-block;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.title span span:nth-child(4n+1){color:#ff4f6d}
.title span span:nth-child(4n+2){color:#ffd23f}
.title span span:nth-child(4n+3){color:#4fb3ff}
.title span span:nth-child(4n+4){color:#5fe08a}
.free-card{
  display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px;cursor:pointer;text-align:left;flex:0 0 auto;
  background:linear-gradient(135deg,#fff7c2,#ffe07a);border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);touch-action:manipulation;
}
.free-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.free-card img{width:84px;height:68px;object-fit:contain}
.free-card b{display:block;font:400 26px/1 var(--display);letter-spacing:.4px}
.free-card small{display:block;font:700 15px/1.25 var(--body);margin-top:4px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;touch-action:pan-x;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:9px 12px;border:3px solid var(--ink);border-radius:16px;background:rgba(255,250,240,.75);box-shadow:0 4px 0 var(--ink);
  font:800 16px/1 var(--body);cursor:pointer;touch-action:pan-x;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--gold);transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
#grid{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:4px 4px 20px;align-content:start}
.card{
  position:relative;display:flex;flex-direction:column;gap:2px;padding:6px 6px 8px;cursor:pointer;touch-action:pan-y;text-align:left;
  background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);transition:transform .09s,box-shadow .09s;
}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.card .pic{width:100%;aspect-ratio:4/3;border-radius:12px;background:linear-gradient(#bfe6ff,#eef9ff);object-fit:contain;display:block}
.card .nm{font:800 16px/1.15 var(--body);padding:0 4px}
.card .meta{font:700 13px/1.1 var(--body);opacity:.7;padding:0 4px;font-variant-numeric:tabular-nums}
.card .badge{position:absolute;top:-8px;right:-8px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--gold);border:3px solid var(--ink)}
.card .badge svg{width:22px;height:22px}
.card .part{position:absolute;top:-8px;right:-8px;padding:4px 8px;border-radius:999px;background:var(--go);color:#fff;border:2px solid var(--ink);font:800 12px/1 var(--body);font-variant-numeric:tabular-nums}

/* ---------- build ---------- */
#build{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"head" "side" "stage" "tools";gap:10px}
.top{grid-area:head;display:flex;align-items:center;gap:8px;min-width:0}
.top .key{width:48px;height:46px}
.top .key svg{width:64%;height:64%}
.grow{flex:1 1 4px;min-width:2px}
.title-pill{display:flex;align-items:center;gap:10px;min-width:0;padding:6px 12px;border:3px solid var(--ink);border-radius:16px;background:var(--key);box-shadow:0 3px 0 var(--ink)}
#bName{font:400 20px/1 var(--display);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:relative;width:74px;height:22px;border-radius:999px;border:2px solid var(--ink);background:#fff;overflow:hidden;flex:0 0 auto}
.prog i{position:absolute;inset:0;width:0;background:var(--go);transition:width .25s}
.prog b{position:absolute;inset:0;display:grid;place-items:center;font:800 13px/1 var(--body);font-variant-numeric:tabular-nums}
#side{grid-area:side;display:flex;flex-direction:column;gap:6px;min-width:0}
#bar,#colors{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;padding:10px 4px 8px}
#bar::-webkit-scrollbar,#colors::-webkit-scrollbar{display:none}
#bar{min-height:92px}
#colors{padding:10px 8px 10px}
#build.tpl #colors{display:none}
.item{
  position:relative;flex:0 0 auto;width:70px;height:70px;display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none;
  border:3px solid var(--ink);border-radius:16px;background:var(--key);box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background-color .15s,opacity .2s;
}
.item img{width:60px;height:60px;pointer-events:none;-webkit-user-drag:none}
.item .n{position:absolute;top:-9px;right:-9px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--ink);color:#fff;border:2px solid #fff;font:800 14px/22px var(--body);text-align:center;font-variant-numeric:tabular-nums}
.item.ready{background:#e3ffe9;box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px #7fe0a0}
.item.later{opacity:.45}
.item[aria-pressed="true"]{background:var(--gold);transform:translateY(-4px);box-shadow:0 8px 0 var(--ink)}
.sw{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:var(--c);cursor:pointer;touch-action:pan-x;box-shadow:0 3px 0 var(--ink)}
.sw.glass{background:linear-gradient(135deg,rgba(191,230,255,.95),rgba(255,255,255,.6) 50%,rgba(150,210,255,.9))}
.sw[aria-pressed="true"]{transform:scale(1.08);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
#stage{grid-area:stage;position:relative;min-height:0;overflow:hidden;border:3px solid var(--ink);border-radius:24px;background:linear-gradient(#8fd0ff,#e6f6ff 75%);box-shadow:0 6px 0 var(--frame-shade)}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:700 18px/1.4 var(--body)}
.tools{grid-area:tools;display:flex;align-items:center;gap:8px}
.tools .key{width:56px;height:54px;border-radius:18px}
.tools .key svg{width:62%;height:62%}
.tools .wide{width:auto;padding:0 16px 0 10px;display:flex;gap:6px;font:800 18px/1 var(--body)}
.tools .wide svg{width:30px;height:30px}
#build.tpl .free-only,#build.free .tpl-only{display:none}
.hold{overflow:hidden}
.hold .fill{position:absolute;inset:0;background:rgba(255,79,139,.5);transform:scaleY(0);transform-origin:bottom;pointer-events:none}
.hold.holding .fill{transform:scaleY(1);transition:transform 800ms linear}
#rotBtn .deg{position:absolute;bottom:-9px;right:-9px;min-width:28px;height:22px;padding:0 5px;border-radius:11px;background:var(--ink);color:#fff;font:800 12px/18px var(--body);border:2px solid #fff;font-variant-numeric:tabular-nums}

#done{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:linear-gradient(transparent 40%,rgba(35,26,79,.18))}
.dcard{width:min(100%,440px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 14px 16px;text-align:center;
  background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);animation:rise .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.dcard h2{margin:0;font:400 26px/1.05 var(--display);letter-spacing:.3px;text-wrap:balance}
.dcard p{margin:0;font:700 15px/1.3 var(--body)}
.dcard .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.dcard .pill{padding:10px 14px;font-size:15px}
#build.finished #side{display:none}

#dragImg{position:fixed;z-index:60;width:76px;height:76px;margin:-38px 0 0 -38px;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(35,26,79,.35))}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#toast{
  position:fixed;z-index:70;left:50%;top:calc(env(safe-area-inset-top) + 70px);width:max-content;max-width:calc(100vw - 28px);
  padding:10px 16px;border-radius:18px;background:var(--ink);color:#fff;font:700 16px/1.25 var(--body);text-align:center;
  transform:translate(-50%,-14px);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease;
}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast{display:flex;align-items:center;gap:10px}
#toast button{flex:0 0 auto;border:2px solid #fff;background:var(--gold);color:var(--ink);font:800 15px/1 var(--body);padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
#toast.show button{pointer-events:auto}

/* ---------- my pictures ---------- */
.home-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pics-btn{cursor:pointer;touch-action:manipulation}
.pics-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pics-btn b{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--pop);color:#fff;font:800 13px/22px var(--body);text-align:center}
#gallery{position:fixed;inset:0;z-index:45;display:flex;flex-direction:column;gap:12px;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
  background:var(--dots),#ffbe7a}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head h2{margin:0;font:400 clamp(28px,8vw,38px)/1 var(--display);letter-spacing:.5px}
.sheet-head .count{font:800 16px/1 var(--body);opacity:.7;font-variant-numeric:tabular-nums}
.sheet-head .key{margin-left:auto;width:48px;height:46px}
.sheet-head .key svg{width:60%;height:60%}
.gal-note{margin:0;font:600 15px/1.35 var(--body);max-width:60ch}
#galGrid{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px;padding:8px 6px 20px;align-content:start}
.thumb{display:flex;flex-direction:column;gap:4px;padding:8px 8px 10px;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);rotate:var(--tilt,0deg);cursor:pointer;touch-action:pan-y;font:800 14px/1.1 var(--body);text-align:left}
.thumb img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;border:2px solid rgba(35,26,79,.2);pointer-events:none}
.empty{flex:1 1 auto;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;font:700 20px/1.3 var(--body)}
.empty svg{width:96px;height:96px}
#viewer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--dots),#ffbe7a;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px)}
#viewImg{flex:1 1 auto;min-height:0;max-width:100%;object-fit:contain;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 6px 0 var(--ink);pointer-events:none}
#viewDate{margin:0;font:700 15px/1.2 var(--body);text-align:center}
.vacts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pill .label{position:relative}

@media (orientation: landscape) and (max-height: 600px){
  #build{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "side stage" "side tools"}
  #side{flex-direction:row;height:100%;min-height:0}
  #bar,#colors{flex-direction:column;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;padding:8px 10px 8px 4px}
  #bar{min-height:0;width:96px}
  #colors{padding:10px}
  .sw{touch-action:pan-y}
  .title{font-size:44px}
}
@media (prefers-reduced-motion: reduce){
  .bump,.wiggle,.dcard{animation:none}
  .key,.pill,.card,.item,#toast{transition:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.7 1.3 6.8L12 17.3l-6 3.4 1.3-6.8-5-4.7 6.8-.8z" fill="#ffc83d" stroke="#231a4f" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-brick" viewBox="0 0 48 48"><rect x="6" y="20" width="36" height="20" rx="3" fill="#ff4f6d" stroke="#231a4f" stroke-width="3"/><rect x="11" y="13" width="9" height="7" rx="2" fill="#ff4f6d" stroke="#231a4f" stroke-width="3"/><rect x="28" y="13" width="9" height="7" rx="2" fill="#ff4f6d" stroke="#231a4f" stroke-width="3"/></symbol>
  </defs>
</svg>

<!-- ================= HOME ================= -->
<section id="home" class="screen" aria-label="Choose something to build">
  <header class="home-head">
    <h1 class="title" aria-label="Brick Builder"><span class="w" aria-hidden="true"><span>B</span><span>r</span><span>i</span><span>c</span><span>k</span></span><span class="w" aria-hidden="true"><span>B</span><span>u</span><span>i</span><span>l</span><span>d</span><span>e</span><span>r</span></span></h1>
    <div class="home-stats">
      <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg><span><b id="builtCount">0</b> of <b id="tplCount">0</b> built</span></span>
      <button id="picsBtn" class="chip pics-btn" type="button" aria-label="My pictures"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="9" width="36" height="30" rx="5" fill="#fff" stroke="#231a4f" stroke-width="3"/><path d="M9 36l10-12 7 8 4-4 9 8z" fill="#3ccf7a" stroke="#231a4f" stroke-width="2.5" stroke-linejoin="round"/><circle cx="33" cy="17" r="4" fill="#ffd23f" stroke="#231a4f" stroke-width="2.5"/></svg>My Pictures<b id="picCount" hidden>0</b></button>
    </div>
  </header>
  <button id="freeBtn" class="free-card" type="button">
    <img id="freeThumb" alt="">
    <span><b>Free Build</b><small>Build anything you can think of</small></span>
  </button>
  <nav id="cats" class="tabs" role="tablist" aria-label="Kinds of models"></nav>
  <div id="grid"></div>
</section>

<!-- ================= BUILD ================= -->
<section id="build" class="screen tpl" aria-label="Building" hidden>
  <header class="top">
    <button id="homeBtn" class="key" type="button" aria-label="Back to all models" title="All models">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 24 24 9l17 15" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21v19h24V21" fill="#ffc83d" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><path d="M20 40V30h8v10" fill="#ff7aa8" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>
    </button>
    <div class="title-pill"><span id="bName">Car</span><span class="prog" id="bProg"><i></i><b>0 / 0</b></span></div>
    <span class="grow"></span>
    <button id="photoBtn" class="key" type="button" aria-label="Save a picture" title="Save a picture">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 15l3-6h10l3 6" fill="#ffa24d" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><rect x="5" y="15" width="38" height="25" rx="6" fill="#ff7aa8" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="27.5" r="8" fill="#bfe8ff" stroke="currentColor" stroke-width="3"/><circle cx="21.5" cy="25" r="2.2" fill="#fff"/></svg>
    </button>
  </header>

  <div id="side">
    <div id="bar" role="toolbar" aria-label="Pieces"></div>
    <div id="colors" role="toolbar" aria-label="Colors"></div>
  </div>

  <main id="stage">
    <canvas id="gl" aria-label="3D building area. Drag to spin, pinch to zoom."></canvas>
    <div id="nogl" hidden>This device can't show 3D right now. Try a newer browser.</div>
    <div id="done" hidden>
      <div class="dcard" role="dialog" aria-labelledby="doneTitle">
        <svg width="120" height="40" viewBox="0 0 72 24" aria-hidden="true"><use href="#i-star" x="0" width="24" height="24"/><use href="#i-star" x="24" width="24" height="24"/><use href="#i-star" x="48" width="24" height="24"/></svg>
        <h2 id="doneTitle">You built it!</h2>
        <p>Spin it around and take a look.</p>
        <div class="acts">
          <button id="playBtn" class="pill" type="button">Keep building</button>
          <button id="anotherBtn" class="pill" type="button">Pick another</button>
          <button id="snapBtn" class="pill primary" type="button">Save picture</button>
        </div>
      </div>
    </div>
  </main>

  <nav class="tools" aria-label="Building tools">
    <button id="helpBtn" class="key wide tpl-only" type="button" aria-label="Show me where">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6a13 13 0 0 0-8 23.3V34h16v-4.7A13 13 0 0 0 24 6z" fill="#ffd23f" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M18 39h12M20 44h8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M20 20a5 5 0 0 1 5-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      Help

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const now = () => performance.now();
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
const H = 1.2;      // brick height, in stud widths
const GAP = 0.02;   // tiny seam between bricks

/* =====================================================================
   Colors
   ===================================================================== */
const COLORS = {
  R: '#d6322a', O: '#f58220', Y: '#f9c814', M: '#9bd13d', G: '#2b8c4a', L: '#62bdea', B: '#1f5bb5', U: '#7d52b8',
  P: '#f39cc3', W: '#f3f3f0', A: '#a6aaae', D: '#5b6067', K: '#262626', N: '#7a4a24', S: '#d9c08c', T: '#bfe6ff'
};
const COLOR_NAMES = { R: 'red', O: 'orange', Y: 'yellow', M: 'lime', G: 'green', L: 'sky blue', B: 'blue', U: 'purple', P: 'pink', W: 'white', A: 'gray', D: 'dark gray', K: 'black', N: 'brown', S: 'tan', T: 'see-through' };
const FREE_COLORS = ['R', 'O', 'Y', 'M', 'G', 'L', 'B', 'U', 'P', 'W', 'A', 'D', 'K', 'N', 'S', 'T'];
const BASES = { grass: '#6cc35a', water: '#4b9fe0', moon: '#b7bbc1', sand: '#e7cf8e', snow: '#dcefff' };
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
const RGBA = {};
for (const k in COLORS) RGBA[k] = [...hexRgb(COLORS[k]), k === 'T' ? 0.5 : 1];
const rgba = c => RGBA[c] || (c && c[0] === '#' ? [...hexRgb(c), 1] : RGBA.W);
const dim = (c, f) => [c[0] * f, c[1] * f, c[2] * f, c[3]];
const lighten = (c, f, a) => [c[0] + (1 - c[0]) * f, c[1] + (1 - c[1]) * f, c[2] + (1 - c[2]) * f, a];

/* =====================================================================
   Model builder: ASCII layers + special pieces, tiled into real bricks
   ===================================================================== */
function Model() {
  const cells = new Map(), sp = [];
  const K = (x, y, z) => x + ',' + y + ',' + z;
  const api = {
    L(y, rows, ox = 0, oz = 0) {
      rows.forEach((row, z) => { for (let x = 0; x < row.length; x++) { const ch = row[x]; if (ch !== '.' && ch !== ' ') cells.set(K(x + ox, y, z + oz), ch); } });
      return api;
    },
    LL(y0, y1, rows, ox, oz) { for (let y = y0; y <= y1; y++) api.L(y, rows, ox, oz); return api; },
    rect(y, x0, z0, w, d, c) { for (let x = x0; x < x0 + w; x++) for (let z = z0; z < z0 + d; z++) cells.set(K(x, y, z), c); return api; },
    ring(y, x0, z0, w, d, c) { for (let x = x0; x < x0 + w; x++) for (let z = z0; z < z0 + d; z++) if (x === x0 || z === z0 || x === x0 + w - 1 || z === z0 + d - 1) cells.set(K(x, y, z), c); return api; },
    where(y, x0, z0, w, d, fn, c) { for (let x = x0; x < x0 + w; x++) for (let z = z0; z < z0 + d; z++) if (fn(x, z)) cells.set(K(x, y, z), c); return api; },
    cell(x, y, z, c) { cells.set(K(x, y, z), c); return api; },
    del(x, y, z) { cells.delete(K(x, y, z)); return api; },
    paint(x, y, z, c) { if (cells.has(K(x, y, z))) cells.set(K(x, y, z), c); return api; },
    piece(kind, x, y, z, w, d, h, rot, c) { sp.push({ kind, x, y, z, w, d, h, rot, c }); return api; },
    slope(x, y, z, w, d, c, rot = 0) { return api.piece('slope', x, y, z, w, d, 1, rot, c); },
    round(x, y, z, c) { return api.piece('round', x, y, z, 1, 1, 1, 0, c); },
    cone(x, y, z, c) { return api.piece('cone', x, y, z, 1, 1, 1, 0, c); },
    dome(x, y, z, c) { return api.piece('dome', x, y, z, 2, 2, 1, 0, c); },
    wheel(x, y, z, rot = 0, c = 'A') { return api.piece('wheel', x, y, z, 1, 1, 1, rot, c); },
    bigwheel(x, y, z, rot = 0, c = 'A') { return api.piece('bigwheel', x, y, z, 2, 1, 2, rot, c); },
    stack(x, z, y0, y1, c, kind = 'round') { for (let y = y0; y <= y1; y++) api[kind](x, y, z, c); return api; },
    gable(x0, y0, z0, w, d, sc, fc, axis = 'x') {
      const chunks = n => { const out = []; let r = n; while (r > 0) { const c = r === 5 ? 3 : Math.min(4, r); out.push(c); r -= c; } return out; };
      for (let k = 0; ; k++) {
        const y = y0 + k;
        if (axis === 'x') {
          const zb = z0 + k, zf = z0 + d - 1 - k;
          if (zb > zf) break;
          if (zb === zf) { api.rect(y, x0, zb, w, 1, sc); break; }
          let x = x0; for (const cw of chunks(w)) { api.slope(x, y, zf, cw, 1, sc, 0); api.slope(x, y, zb, cw, 1, sc, 2); x += cw; }
          if (zf - zb > 1) api.rect(y, x0, zb + 1, w, zf - zb - 1, fc);
        } else {
          const xl = x0 + k, xr = x0 + w - 1 - k;
          if (xl > xr) break;
          if (xl === xr) { api.rect(y, xl, z0, 1, d, sc); break; }
          let z = z0; for (const cw of chunks(d)) { api.slope(xr, y, z, cw, 1, sc, 1); api.slope(xl, y, z, cw, 1, sc, 3); z += cw; }
          if (xr - xl > 1) api.rect(y, xl + 1, z0, xr - xl - 1, d, fc);
        }
      }
      return api;
    },
    build() {
      const byY = new Map();
      for (const [k, c] of cells) { const [x, y, z] = k.split(',').map(Number); if (!byY.has(y)) byY.set(y, []); byY.get(y).push({ x, z, c }); }
      const out = [];
      for (const [y, list] of byY) {
        const map = new Map(list.map(o => [o.x + ',' + o.z, o.c])), used = new Set(), odd = y & 1;
        list.sort((a, b) => odd ? (a.x - b.x) || (a.z - b.z) : (a.z - b.z) || (a.x - b.x));
        const sizes = odd
          ? [[2, 4], [4, 2], [2, 3], [3, 2], [2, 2], [1, 4], [4, 1], [1, 3], [3, 1], [1, 2], [2, 1], [1, 1]]
          : [[4, 2], [2, 4], [3, 2], [2, 3], [2, 2], [4, 1], [1, 4], [3, 1], [1, 3], [2, 1], [1, 2], [1, 1]];
        for (const o of list) {
          if (used.has(o.x + ',' + o.z)) continue;
          for (const [w, d] of sizes) {
            let ok = true;
            for (let i = 0; i < w && ok; i++) for (let j = 0; j < d && ok; j++) { const kk = (o.x + i) + ',' + (o.z + j); if (used.has(kk) || map.get(kk) !== o.c) ok = false; }
            if (!ok) continue;
            for (let i = 0; i < w; i++) for (let j = 0; j < d; j++) used.add((o.x + i) + ',' + (o.z + j));
            out.push({ kind: 'brick', x: o.x, y, z: o.z, w, d, h: 1, rot: 0, c: o.c });
            break;
          }
        }
      }
      return out.concat(sp);
    }
  };
  return api;
}

/* =====================================================================
   The models
   ===================================================================== */
const CATS = [
  { id: 'go', name: 'Vehicles' }, { id: 'space', name: 'Space' }, { id: 'town', name: 'Buildings' },
  { id: 'animals', name: 'Animals' }, { id: 'fun', name: 'Fun stuff' }
];
const TPL = [];
const T = (cat, id, name, base, fn) => TPL.push({ cat, id, name, base, fn });
const rep = (n, s) => Array(n).fill(s);
const notCorner = (w, d) => (x, z) => !((x === 0 || x === w - 1) && (z === 0 || z === d - 1));

/* ---- Vehicles ---- */
T('go', 'car', 'Car', 'grass', m => {
  m.wheel(1, 0, 0).wheel(1, 0, 3).wheel(6, 0, 0).wheel(6, 0, 3);
  m.L(1, rep(4, 'RRRRRRRR'));
  m.L(2, ['RRRRRRRY', 'RRRRRRRR', 'RRRRRRRR', 'RRRRRRRY']);
  m.L(3, ['..RTTR..', '..T..T..', '..T..T..', '..RTTR..']);
  m.L(4, rep(4, '..RRRR..'));
  m.slope(6, 3, 0, 4, 1, 'R', 1).slope(1, 3, 0, 4, 1, 'R', 3);
});
T('go', 'racecar', 'Race Car', 'grass', m => {
  m.wheel(1, 0, 0, 0, 'R').wheel(1, 0, 3, 0, 'R').wheel(7, 0, 0, 0, 'R').wheel(7, 0, 3, 0, 'R');
  m.L(1, rep(4, 'YYYYYYYYY'));
  m.slope(9, 1, 1, 2, 1, 'Y', 1);
  m.L(2, ['YYYYYYYY.', 'YYKK.YYY.', 'YYKK.YYY.', 'YYYYYYYY.']);
  m.slope(8, 2, 1, 2, 1, 'Y', 1);
  m.L(3, ['', 'K....T', 'K....T', '']);
  m.round(3, 3, 1, 'W');
  m.L(4, rep(4, 'R'));
});
T('go', 'truck', 'Truck', 'grass', m => {
  [1, 3, 9].forEach(x => m.wheel(x, 0, 0).wheel(x, 0, 3));
  m.L(1, rep(4, 'DDDDDDDDDDD'));
  m.L(2, ['BBBBBBBBRRY', 'BBBBBBBBRRR', 'BBBBBBBBRRR', 'BBBBBBBBRRY']);
  m.L(3, ['BBBBBBBBRTT', 'BBBBBBBBRRT', 'BBBBBBBBRRT', 'BBBBBBBBRTT']);
  m.L(4, rep(4, 'BBBBBBBBRRR'));
});
T('go', 'bus', 'School Bus', 'grass', m => {
  [2, 9].forEach(x => m.wheel(x, 0, 0).wheel(x, 0, 3));
  m.L(1, rep(4, 'YYYYYYYYYYYY'));
  m.L(2, ['YYYYYYYYYYYW', 'YYYYYYYYYYYY', 'YYYYYYYYYYYY', 'YYYYYYYYYYYW']);
  m.L(3, ['YTTYTTYTTYTY', 'Y..........T', 'Y..........T', 'YTTYTTYTTYTY']);
  m.L(4, rep(4, 'WWWWWWWWWWWW'));
});
T('go', 'firetruck', 'Fire Truck', 'grass', m => {
  [1, 3, 9].forEach(x => m.wheel(x, 0, 0).wheel(x, 0, 3));
  m.L(1, rep(4, 'RRRRRRRRRRR'));
  m.L(2, ['RRRRRRRRRRY', 'RRRRRRRRRRR', 'RRRRRRRRRRR', 'RRRRRRRRRRY']);
  m.L(3, ['RRRRRRRRRTT', 'RRRRRRRRRRT', 'RRRRRRRRRRT', 'RRRRRRRRRTT']);
  m.L(4, ['RRRRRRRRRRR', 'AAAAAAAARRR', 'AAAAAAAARRR', 'RRRRRRRRRRR']);
  m.L(5, ['', '.WWWWWW', '.WWWWWW', '']);
  m.round(9, 5, 1, 'B').round(9, 5, 2, 'R');
});
T('go', 'tractor', 'Tractor', 'grass', m => {
  m.bigwheel(0, 0, 0, 0, 'Y').bigwheel(0, 0, 3, 0, 'Y').wheel(5, 0, 0, 0, 'Y').wheel(5, 0, 3, 0, 'Y');
  m.L(0, ['', 'DDDDDDD', 'DDDDDDD', '']);
  m.L(1, ['', 'GGGGGGY', 'GGGGGGY', '']);
  m.L(2, ['GG', 'GGGGGGG', 'GGGGGGG', 'GG']);
  m.L(3, rep(4, 'TT'));
  m.L(4, rep(4, 'GG'));
  m.round(5, 3, 1, 'A').round(5, 4, 1, 'K');
});
T('go', 'train', 'Train', 'grass', m => {
  [1, 4, 7].forEach(x => m.wheel(x, 0, 0, 0, 'R').wheel(x, 0, 2, 0, 'R'));
  m.L(0, ['', 'DDDDDDDDDD', '']);
  m.L(1, rep(3, 'RRRRRRRRRR'));
  m.L(2, rep(3, 'RRRKKKKKKK'));
  m.L(3, ['RTRKKKKKKK', 'R..KKKKKKK', 'RTRKKKKKKK']);
  m.L(4, rep(3, 'RRR'));
  m.round(8, 4, 1, 'K').round(8, 5, 1, 'K').round(5, 4, 1, 'Y');
  m.slope(10, 0, 0, 3, 1, 'D', 1);
});
T('go', 'boat', 'Speed Boat', 'water', m => {
  m.L(0, ['.RRRRRRR..', 'RRRRRRRRR.', 'RRRRRRRRR.', '.RRRRRRR..']);
  m.slope(9, 0, 1, 2, 1, 'R', 1);
  m.L(1, ['WWWWWWWWW.', 'WSSSSSSSWW', 'WSSSSSSSWW', 'WWWWWWWWW.']);
  m.slope(10, 1, 1, 2, 1, 'W', 1);
  m.L(2, ['', '...WWWWT', '...WWWWT', '']);
  m.L(3, ['', '...BBBB', '...BBBB', '']);
});
T('go', 'sailboat', 'Sailboat', 'water', m => {
  m.L(0, ['.NNNNNN.', 'NNNNNNNN', '.NNNNNN.']);
  m.L(1, ['NNNNNNN.', 'NSSSSSSN', 'NNNNNNN.']);

  m.L(2, ['', '....WWW']).L(3, ['', '....WWW']).L(4, ['', '....WW']).L(5, ['', '....WW']).L(6, ['', '....W']);
  m.cell(4, 7, 1, 'R');
});
T('go', 'plane', 'Airplane', 'moon', m => {
  m.wheel(3, 0, 3).wheel(3, 0, 4).wheel(8, 0, 3);
  m.L(1, ['...RRR....', '...BBB....', '...BBB....', 'WWWWWWWWWWK', 'WWWWWWWWWWK', '...BBB....', '...BBB....', '...RRR....']);
  m.L(2, ['', 'B', 'B', 'WWWWWWWTT', 'WWWWWWWTT', 'B', 'B', '']);
  m.slope(9, 2, 3, 2, 1, 'W', 1);
  m.L(3, ['', '', '', 'RR', 'RR']);
  m.L(4, ['', '', '', 'R', 'R']);
});
T('go', 'helicopter', 'Helicopter', 'grass', m => {
  m.L(0, ['', '', '', '....KKKKKK', '', '....KKKKKK']);
  m.L(1, ['', '', '', '....RRRRRR', '....RRRRRR', '....RRRRRR']);
  m.L(2, ['', '', '', '....RRRRTT', 'RRRRRRRRTT', '....RRRRTT']);
  m.L(3, ['', '', '', '....RRRRRR', 'R...RRRRRR', '....RRRRRR']);
  m.round(6, 4, 4, 'K');
  m.L(5, ['......K', '......K', '......K', '......K', '..KKKKKKKKK', '......K', '......K', '......K', '......K']);
});
T('go', 'submarine', 'Submarine', 'water', m => {
  m.L(0, rep(3, '.YYYYYYYY.'));
  m.L(1, ['DYYTYTYTYY', 'DYYYYYYYYY', 'DYYTYTYTYY']);
  m.L(2, rep(3, '.YYYYYYYY.'));
  m.L(3, ['', '....YYY', '']);

});

/* ---- Space ---- */
T('space', 'rocket', 'Rocket', 'moon', m => {
  m.LL(0, 1, ['..RR..', '.WWWW.', 'RWWWWR', 'RWWWWR', '.WWWW.', '..RR..']);
  const body = c => ['', '.' + c.repeat(4) + '.', '.' + c.repeat(4) + '.', '.' + c.repeat(4) + '.', '.' + c.repeat(4) + '.', ''];
  m.L(2, body('W')).L(3, body('R')).L(4, ['', '.WWWW.', '.WWWW.', '.WWWW.', '.WTTW.', '']).L(5, body('W'));
  m.L(6, ['', '', '..RR..', '..RR..', '', '']);
  m.slope(2, 6, 4, 2, 1, 'R', 0).slope(2, 6, 1, 2, 1, 'R', 2).slope(4, 6, 2, 2, 1, 'R', 1).slope(1, 6, 2, 2, 1, 'R', 3);
  m.dome(2, 7, 2, 'R');
});
T('space', 'spaceship', 'Star Fighter', 'moon', m => {
  m.round(2, 0, 4, 'D').round(2, 0, 5, 'D').round(7, 0, 4, 'D').round(7, 0, 5, 'D');
  m.L(1, ['..RRRRR...', '..WWWWW...', '..WWWWW...', 'OAAAAAAAAA', 'OAAAAAAAAA', 'OAAAAAAAAA', 'OAAAAAAAAA', '..WWWWW...', '..WWWWW...', '..RRRRR...']);
  m.slope(10, 1, 3, 4, 1, 'A', 1);
  m.L(2, ['...RRRR', '', '', '.AAAAAAAA', 'AAAAATTT', 'AAAAATTT', '.AAAAAAAA', '', '', '...RRRR']);
  m.slope(8, 2, 4, 2, 1, 'A', 1);
  m.L(3, ['', '', '', '', 'RR', 'RR']);
});
T('space', 'ufo', 'UFO', 'moon', m => {

  m.L(2, ['..YAAY..', '.AAAAAA.', 'YAAAAAAY', 'AAAAAAAA', 'AAAAAAAA', 'YAAAAAAY', '.AAAAAA.', '..YAAY..']);
  m.L(3, ['', '', '..AAAA..', '..AAAA..', '..AAAA..', '..AAAA..', '', '']);
  m.L(4, ['', '', '...TT...', '..TMMT..', '..TMMT..', '...TT...', '', '']);

T('space', 'robot', 'Robot', 'moon', m => {

const footW = p => (p.rot & 1 ? p.d : p.w);
const footD = p => (p.rot & 1 ? p.w : p.d);
function prepare(def) {
  if (def._b) return def._b;
  const m = Model(); def.fn(m);
  let pieces = m.build().map(p => ({ ...p, h: p.h || 1, rot: p.rot || 0 }));
  let x0 = Infinity, z0 = Infinity, x1 = -Infinity, z1 = -Infinity, y1 = 0;
  for (const p of pieces) { x0 = Math.min(x0, p.x); z0 = Math.min(z0, p.z); x1 = Math.max(x1, p.x + footW(p)); z1 = Math.max(z1, p.z + footD(p)); y1 = Math.max(y1, p.y + p.h); }
  const mw = x1 - x0, md = z1 - z0, pad = 2;
  const W = Math.max(10, mw + pad * 2), D = Math.max(10, md + pad * 2);
  const ox = Math.floor((W - mw) / 2) - x0, oz = Math.floor((D - md) / 2) - z0;
  pieces = pieces.map(p => ({ ...p, x: p.x + ox, z: p.z + oz }));
  pieces.sort((a, b) => a.y - b.y || a.z - b.z || a.x - b.x);
  def._b = { pieces, W, D, top: y1 };

}

    if (!was.kind) { if (e.type === 'pointerup' && b._tap) b._tap(); return; }
    if (was.kind === 'scroll') {
      const sm = was.samples;
      if (e.type === 'pointerup' && sm.length > 1 && now() - sm[sm.length - 1][0] < 80) flingBar((sm[sm.length - 1][1] - sm[0][1]) / Math.max(1, sm[sm.length - 1][0] - sm[0][0]), was.vert);
      return;
    }
    if (was.kind !== 'drag') return;
    setPreview(null);
    let landed = false;
    if (e.type === 'pointerup' && overStage(e.clientX, e.clientY)) {
      const [sx, sy] = stageXY(e.clientX, e.clientY);
      if (mode === 'free') { const p = freeCandidate(sx, sy - 40); if (p) { freeAdd(p); landed = true; } else Sound.bonk(); }
      else if (TS && TS.sel) {
        let i = ghostAt(sx, sy, TS.sel); if (i < 0) i = nearestGhost(sx, sy, TS.sel, 110);
        if (i >= 0) { tplPlace(i); landed = true; } else { Sound.bonk(); toast('Drop it on a glowing spot!'); }
      }
    }
    if (!landed) putBack(was);
  };
  b.addEventListener('pointerup', end);
  b.addEventListener('pointercancel', end);
  b.addEventListener('lostpointercapture', end);
}

/* =====================================================================
   Stage gestures: drag = spin, pinch = zoom, two fingers = slide, tap = build
   ===================================================================== */
const pts = new Map();
let gest = null;
const local = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
function pan(dx, dy) {
  const k = cam.r * 0.0016, c = camState();
  const rx = c.right[0], rz = c.right[2], fl = Math.hypot(c.fwd[0], c.fwd[2]) || 1, fx = c.fwd[0] / fl, fz = c.fwd[2] / fl;
  const b = cam.bounds || [0, 0, 0, 16, 0, 16];
  cam.target[0] = clamp(cam.target[0] - rx * dx * k + fx * dy * k, b[0], b[3]);
  cam.target[2] = clamp(cam.target[2] - rz * dx * k + fz * dy * k, b[2], b[5]);
}
function pressStart(x, y) {
  if (mode === 'free') {
    if (F.erase) { const p = freePieceAt(x, y); setPreview(p, true); }
    else setPreview(freeCandidate(x, y));
  }
}
function pressCancel() { if (mode === 'free') setPreview(null); }
function tapAt(x, y) {
  if (mode === 'tpl') { tplTap(x, y); return; }
  setPreview(null);
  if (F.erase) { const p = freePieceAt(x, y); if (p) freeRemove(p); else Sound.bonk(); return; }
  const p = freeCandidate(x, y);
  if (p) freeAdd(p); else Sound.bonk();
}
canvas.addEventListener('pointerdown', e => {
  if (!$('#done').hidden && mode === 'tpl') { /* let them spin the finished model */ }
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const p = local(e); pts.set(e.pointerId, p);
  spin = null;
  if (pts.size === 1) { gest = { type: 'tap', id: e.pointerId, x0: p.x, y0: p.y }; if ($('#done').hidden) pressStart(p.x, p.y); }
  else if (pts.size === 2) {
    pressCancel();
    const [a, b] = [...pts.values()];
    gest = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, r0: cam.r, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId) || !gest) return;
  e.preventDefault();
  const p = local(e), prev = pts.get(e.pointerId); pts.set(e.pointerId, p);
  if (gest.type === 'tap' && Math.hypot(p.x - gest.x0, p.y - gest.y0) > 9) { pressCancel(); gest.type = 'orbit'; }
  if (gest.type === 'orbit' && e.pointerId === gest.id) {
    cam.theta -= (p.x - prev.x) * 0.009;
    cam.phi = clamp(cam.phi + (p.y - prev.y) * 0.007, 0.06, 1.45);
  } else if (gest.type === 'pinch' && pts.size >= 2) {
    const [a, b] = [...pts.values()];
    cam.r = clamp(gest.r0 * gest.d0 / (Math.hypot(a.x - b.x, a.y - b.y) || 1), cam.rMin, cam.rMax);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    pan(mx - gest.mx, my - gest.my); gest.mx = mx; gest.my = my;
  }
});
function ptrEnd(e) {
  if (!pts.has(e.pointerId)) return;
  const p = local(e);
  if (gest && gest.type === 'tap' && gest.id === e.pointerId && e.type === 'pointerup' && $('#done').hidden) tapAt(p.x, p.y);
  else if (gest && gest.type === 'tap') pressCancel();
  pts.delete(e.pointerId);
  if (pts.size === 1 && gest && gest.type === 'pinch') gest = { type: 'orbit', id: [...pts.keys()][0] };
  if (pts.size === 0) { gest = null; if (mode === 'free' && viewBucket() !== iconView) refreshFreeIcons(); }
}
canvas.addEventListener('pointerup', ptrEnd);
canvas.addEventListener('pointercancel', ptrEnd);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.r = clamp(cam.r * Math.exp(e.deltaY * 0.0012), cam.rMin, cam.rMax); }, { passive: false });
canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
if ('ResizeObserver' in window) new ResizeObserver(() => sizeCanvas()).observe(stage);

   Screens
   ===================================================================== */
function showBuild() {

  $('#build').classList.toggle('tpl', mode === 'tpl'); $('#build').classList.toggle('free', mode === 'free'); $('#build').classList.remove('finished');
  anims.forEach(a => R && R.free(a.mesh)); anims = []; animating.clear(); spin = null;

let curCat = 0;
const thumbQueue = [];

}
function renderHome() {
  const built = TPL.filter(d => store.done[d.id]).length;
  $('#builtCount').textContent = String(built); $('#tplCount').textContent = String(TPL.length);

    if (done) card.insertAdjacentHTML('beforeend', '<span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg></span>');
    else if (Array.isArray(prog) && prog.length) card.insertAdjacentHTML('beforeend', `<span class="part">${prog.length}/${b.pieces.length}</span>`);

/* =====================================================================
   Saving a picture
   ===================================================================== */
// Saving only ever keeps pictures on this device. Nothing here opens the share sheet,
// Claude's save prompt, or anything else that could send a picture somewhere.
// iPhone home-screen apps can't download files reliably (the app can get stuck on a
// download screen), so there pictures stay inside the game's own My Pictures.
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const FRAMED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const STANDALONE = (() => { try { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches; } catch (e) { return false; } })();
const canDownload = () => !FRAMED && !(IS_IOS && STANDALONE);
const phoneSaveAvailable = () => canDownload();

/* pictures live in this browser's storage on the device (IndexedDB, or memory if that is unavailable) */
const PicStore = (() => {
  let dbp = null, useMem = false;
  const mem = { pics: [], nextId: 1 };
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const timer = setTimeout(() => rej(new Error('timeout')), 3000);
      try {
        if (!window.indexedDB) throw new Error('no indexedDB');
        const r = indexedDB.open('brick-builder-pictures', 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('pics')) d.createObjectStore('pics', { keyPath: 'id', autoIncrement: true }); };
        r.onsuccess = () => { clearTimeout(timer); res(r.result); };
        r.onerror = () => { clearTimeout(timer); rej(r.error); };
        r.onblocked = () => { clearTimeout(timer); rej(new Error('blocked')); };
      } catch (e) { clearTimeout(timer); rej(e); }
    });
    return dbp;
  }
  function req(mode, fn) {
    return open().then(db => new Promise((res, rej) => {
      let out; const t = db.transaction('pics', mode), r = fn(t.objectStore('pics'));
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));
  }
  async function safe(dbFn, memFn) { if (useMem) return memFn(); try { return await dbFn(); } catch (e) { useMem = true; return memFn(); } }
  return {
    add: rec => safe(() => req('readwrite', s => s.add(rec)), () => { rec.id = mem.nextId++; mem.pics.push(rec); return rec.id; }),
    all: () => safe(() => req('readonly', s => s.getAll()), () => mem.pics.slice()),
    del: id => safe(() => req('readwrite', s => s.delete(id)), () => { mem.pics = mem.pics.filter(p => p.id !== id); }),
    get persistent() { return !useMem; }
  };
})();
const pad2 = n => String(n).padStart(2, '0');
function picFileName(rec) {
  const d = new Date(rec.created);
  return `brick-builder-${rec.slug || 'build'}-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}.png`;
}
function downloadToDevice(blob, name) {
  if (!canDownload()) { toast('Your picture is kept in My Pictures.'); return; }
  try {
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 10000);
    toast(IS_IOS ? 'Saved to the Files app, in Downloads.' : 'Saved! Look in Downloads or your Photos app.');
  } catch (e) { toast('Your picture is kept in My Pictures.'); }
}
let picCount = 0, snapping = false;
function updatePicCount() { const b = $('#picCount'); b.textContent = String(picCount); b.hidden = picCount <= 0; }
function savePicture() {
  if (!R || snapping) return;
  snapping = true;
  setMesh('preview', null);
  frame(); // draw a fresh frame, then copy it right away
  const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext('2d'), grd = g.createLinearGradient(0, 0, 0, c.height);
  grd.addColorStop(0, '#8fd0ff'); grd.addColorStop(0.75, '#e6f6ff'); grd.addColorStop(1, '#e6f6ff');
  g.fillStyle = grd; g.fillRect(0, 0, c.width, c.height); g.drawImage(canvas, 0, 0);
  const f = $('#stage'); f.animate && !reduceMotion && f.animate([{ filter: 'brightness(1.8)' }, { filter: 'brightness(1)' }], { duration: 350 });
  Sound.noise(0.08, { vol: 0.3, f1: 3200, f2: 1600, q: 0.8 }); Sound.noise(0.07, { vol: 0.22, f1: 2200, f2: 900, q: 0.8, delay: 0.09 });
  const rec = { created: Date.now(), name: TS ? TS.def.name : 'Free Build', slug: TS ? TS.def.id : 'free' };
  c.toBlob(async b => {
    try {
      if (!b) throw new Error('no picture');
      rec.blob = b;
      await PicStore.add(rec);
      picCount++; updatePicCount();
      toast('Saved in My Pictures!', 2400, canDownload() ? { label: 'Save to phone', fn: () => downloadToDevice(b, picFileName(rec)) } : null);
      Sound.layer();
    } catch (e) { toast('That picture could not be saved. Try again.'); }
    snapping = false;
  }, 'image/png');
}

/* ---- My Pictures ---- */
let gPics = [], galUrls = [], viewing = null;
const fmtDate = ts => { try { return new Date(ts).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return new Date(ts).toString(); } };
function revokeGal() { galUrls.forEach(u => URL.revokeObjectURL(u)); galUrls = []; }
function renderGallery() {
  revokeGal();
  const grid = $('#galGrid'); grid.textContent = '';
  $('#galEmpty').hidden = gPics.length > 0; grid.hidden = gPics.length === 0;
  $('#galCount').textContent = gPics.length ? `${gPics.length} picture${gPics.length === 1 ? '' : 's'}` : '';
  $('#galNote').textContent = !PicStore.persistent ? 'Pictures are only kept until this page closes.'
    : canDownload() ? 'Pictures are kept on this device. Tap one, then Save to phone to put a copy in your Downloads.'
    : 'Your pictures are kept here on this device.';
  gPics.forEach((p, i) => {
    const u = URL.createObjectURL(p.blob); galUrls.push(u);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'thumb'; b.style.setProperty('--tilt', ((i % 3) - 1) * 2 + 'deg');
    b.setAttribute('aria-label', `${p.name || 'Build'}, ${fmtDate(p.created)}`);
    const im = document.createElement('img'); im.src = u; im.alt = ''; im.decoding = 'async'; im.draggable = false;
    const nm = document.createElement('span'); nm.textContent = p.name || 'Build';
    b.append(im, nm);
    b.addEventListener('click', () => { viewing = p; $('#viewImg').src = u; $('#viewDate').textContent = `${p.name || 'Build'} · ${fmtDate(p.created)}`; $('#vSave').hidden = !canDownload(); $('#viewer').hidden = false; Sound.pop(); });
    grid.appendChild(b);
  });
}
async function openGallery() {
  Sound.click();
  try { gPics = (await PicStore.all()) || []; } catch (e) { gPics = []; }
  gPics.sort((a, b) => b.created - a.created);
  picCount = gPics.length; updatePicCount();
  renderGallery(); $('#viewer').hidden = true; $('#gallery').hidden = false;
}
function closeGallery() { $('#gallery').hidden = true; $('#viewer').hidden = true; $('#viewImg').removeAttribute('src'); revokeGal(); Sound.click(); }
async function deleteViewing() {
  if (!viewing) return;
  const id = viewing.id;
  try { await PicStore.del(id); } catch (e) {}
  gPics = gPics.filter(p => p.id !== id); picCount = gPics.length; updatePicCount();
  viewing = null; $('#viewer').hidden = true; $('#viewImg').removeAttribute('src');
  renderGallery(); Sound.whoosh();
}
function makeHold(btn, ms, done, tapMsg) {
  let timer = 0, fired = false;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); fired = false; btn.classList.add('holding'); try { btn.setPointerCapture(e.pointerId); } catch (_) {} timer = setTimeout(() => { timer = 0; fired = true; btn.classList.remove('holding'); done(); }, ms); });
  const stop = () => { if (!timer) return; clearTimeout(timer); timer = 0; btn.classList.remove('holding'); if (!fired && tapMsg) { toast(tapMsg); Sound.click(); } };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => btn.addEventListener(t, stop));
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); done(); } });
}

/* =====================================================================
   Confetti
   ===================================================================== */
function confetti() {
  if (reduceMotion) return;
  const c = $('#confetti'), g = c.getContext('2d'), W = innerWidth, Hh = innerHeight;
  c.width = Math.round(W * DPR); c.height = Math.round(Hh * DPR); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const cols = ['#ffc83d', '#ff4f8b', '#2fcf6b', '#4fb3ff', '#9a7bff', '#ff8a3d'];
  const parts = Array.from({ length: 120 }, () => ({ x: rand(0, W), y: rand(-Hh * 0.6, -10), vx: rand(-40, 40), vy: rand(120, 260), r: rand(5, 9), a: rand(0, 6.28), va: rand(-6, 6), c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = now(); let last = t0;
  const step = () => {
    const t = now(), dt = Math.min(0.05, (t - last) / 1000); last = t;
    g.clearRect(0, 0, W, Hh);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.a += p.va * dt; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r, -p.r * 0.45, p.r * 2, p.r * 0.9); g.restore(); }
    if (t - t0 < 3200) requestAnimationFrame(step); else g.clearRect(0, 0, W, Hh);
  };
  step();
}

/* =====================================================================
   Wiring
   ===================================================================== */
$('#homeBtn').addEventListener('click', goHome);
$('#freeBtn').addEventListener('click', () => { Sound.pop(); loadFree(); F.undo = []; startFree(false); });

makeHold($('#vDel'), 800, deleteViewing, 'Press and hold to delete');

$('#rotBtn').addEventListener('click', () => { F.rot = (F.rot + 1) % 4; Sound.click(); updateTools(); bump($('#rotBtn')); refreshFreeIcons(); });

(() => {
  const btn = $('#clearBtn'); let timer = 0, fired = false;
  btn.addEventListener('pointerdown', e => { e.preventDefault(); fired = false; btn.classList.add('holding'); try { btn.setPointerCapture(e.pointerId); } catch (_) {} timer = setTimeout(() => { timer = 0; fired = true; btn.classList.remove('holding'); freeClear(); }, 800); });
  const stop = () => { if (!timer) return; clearTimeout(timer); timer = 0; btn.classList.remove('holding'); if (!fired) { toast('Press and hold to clear everything'); Sound.click(); } };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => btn.addEventListener(t, stop));
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); freeClear(); } });
})();
document.addEventListener('keydown', e => {
  if ($('#build').hidden) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && mode === 'free') { e.preventDefault(); freeUndo(); }
  if (e.key === 'r' && mode === 'free') $('#rotBtn').click();
  if (e.key === 'Escape') goHome();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#gallery').hidden) { if (!$('#viewer').hidden) $('#viewer').hidden = true; else closeGallery(); }
});

/* =====================================================================
   Boot
   ===================================================================== */
let booted = false;
function start(snap) {
  if (booted) return; booted = true;
  snap = snap || {};
  loadFree();
  if (typeof snap.cat === 'number' && CATS[snap.cat]) curCat = snap.cat;
  try { if (R) $('#freeThumb').src = picture([
    { kind: 'brick', x: 0, y: 0, z: 0, w: 4, d: 2, h: 1, rot: 0, c: 'B' }, { kind: 'brick', x: 1, y: 1, z: 0, w: 2, d: 2, h: 1, rot: 0, c: 'R' },
    { kind: 'brick', x: 4, y: 0, z: 0, w: 2, d: 2, h: 1, rot: 0, c: 'Y' }, { kind: 'slope', x: 4, y: 1, z: 0, w: 2, d: 2, h: 1, rot: 1, c: 'G' },
    { kind: 'round', x: 0, y: 1, z: 1, w: 1, d: 1, h: 1, rot: 0, c: 'O' }, { kind: 'cone', x: 0, y: 2, z: 1, w: 1, d: 1, h: 1, rot: 0, c: 'U' }
  ], 200, 160, 0.55, 0.42); } catch (e) {}
  renderHome();
  if (!R) $('#grid').insertAdjacentHTML('afterbegin', '<p style="grid-column:1/-1;font:700 17px/1.4 var(--body)">This device can\'t show 3D right now. Try a newer browser.</p>');
  PicStore.all().then(p => { picCount = (p || []).length; updatePicCount(); }).catch(() => {});
  if (snap.screen === 'tpl') { const def = TPL.find(d => d.id === snap.id); if (def) startTemplate(def); }
  else if (snap.screen === 'free') startFree(false);
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ screen: mode === 'home' ? 'home' : mode, id: TS ? TS.def.id : null, cat: curCat }));
  } catch (e) {}
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start);
else start((hot && hot.data) || {});
})();
